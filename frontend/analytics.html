<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - API Monitor</title>
    <meta name="description" content="Live API monitoring analytics">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg: #f4f7fb;
            --panel: #ffffff;
            --panel-2: #f8fafc;
            --border: #dbe3ee;
            --text: #172033;
            --muted: #64748b;
            --primary: #7357ff;
            --primary-2: #8b5cf6;
            --green: #10b981;
            --red: #ef4444;
            --amber: #f59e0b;
            --blue: #38bdf8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at 85% 5%, rgba(115, 87, 255, 0.14), transparent 28%),
                radial-gradient(circle at 10% 90%, rgba(56, 189, 248, 0.07), transparent 24%),
                var(--bg);
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        button,
        select {
            font: inherit;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 178px;
            flex-shrink: 0;
            background: rgba(10, 19, 38, 0.96);
            border-right: 1px solid var(--border);
            padding: 20px 13px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 0 7px 26px;
        }

        .brand-logo {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            color: white;
            font-weight: 900;
            box-shadow: 0 7px 18px rgba(99, 102, 241, 0.25);
        }

        .brand-title {
            font-size: 13px;
            font-weight: 900;
        }

        .brand-subtitle {
            margin-top: 2px;
            color: #64748b;
            font-size: 8px;
        }

        .menu-label {
            padding: 0 8px 8px;
            color: #64748b;
            font-size: 8px;
            font-weight: 800;
            letter-spacing: 0.1em;
        }

        .nav {
            display: grid;
            gap: 4px;
        }

        .nav a {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 9px 10px;
            border-radius: 9px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 11px;
            font-weight: 700;
        }

        .nav a:hover,
        .nav a.active {
            background: rgba(115, 87, 255, 0.18);
            color: #c4b5fd;
        }

        .main {
            flex: 1;
            min-width: 0;
            padding: 28px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 20px;
        }

        .eyebrow {
            margin-bottom: 5px;
            color: #8b7cff;
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }

        h1 {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 29px;
            letter-spacing: -0.03em;
        }

        .subtitle {
            margin: 7px 0 0;
            color: var(--muted);
            font-size: 12px;
            word-break: break-all;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 9px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .control {
            height: 38px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--panel);
            color: #e2e8f0;
            padding: 0 12px;
            outline: none;
            font-size: 11px;
            font-weight: 800;
        }

        .control:focus {
            border-color: var(--primary);
        }

        .btn {
            height: 38px;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0 14px;
            background: var(--panel);
            color: #dbe4f0;
            cursor: pointer;
            font-size: 11px;
            font-weight: 800;
        }

        .btn:hover {
            border-color: #53678f;
        }

        .btn-primary {
            border-color: transparent;
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            color: white;
            box-shadow: 0 7px 18px rgba(99, 102, 241, 0.22);
        }

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: rgba(13, 22, 43, 0.88);
        }

        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .toolbar-label {
            color: var(--muted);
            font-size: 10px;
            font-weight: 800;
        }

        .live {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #86efac;
            font-size: 10px;
            font-weight: 800;
        }

        .live-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.10);
        }

        .metrics {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 14px;
            margin-bottom: 16px;
        }

        .metric {
            position: relative;
            overflow: hidden;
            min-height: 116px;
            background: rgba(13, 22, 43, 0.96);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px;
        }

        .metric::after {
            content: "";
            position: absolute;
            right: -24px;
            bottom: -28px;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(115, 87, 255, 0.07);
        }

        .metric-label {
            color: #a5b4c8;
            font-size: 10px;
            font-weight: 800;
        }

        .metric-value {
            margin-top: 10px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 25px;
            font-weight: 900;
            letter-spacing: -0.03em;
        }

        .metric-help {
            margin-top: 5px;
            color: #64748b;
            font-size: 9px;
        }

        .grid {
            display: grid;
            grid-template-columns: minmax(0, 1.35fr) minmax(290px, 0.65fr);
            gap: 16px;
            margin-bottom: 16px;
        }

        .card {
            background: rgba(13, 22, 43, 0.96);
            border: 1px solid var(--border);
            border-radius: 15px;
            overflow: hidden;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 16px 18px;
            border-bottom: 1px solid #1d2c4b;
        }

        .card-title {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 15px;
            font-weight: 900;
        }

        .card-subtitle {
            margin: 4px 0 0;
            color: #64748b;
            font-size: 10px;
        }

        .card-body {
            padding: 18px;
        }

        .chart-wrap {
            height: 330px;
        }

        .mini-chart {
            height: 235px;
        }

        .status-panel {
            min-height: 235px;
            display: grid;
            place-items: center;
            text-align: center;
        }

        .status-circle {
            width: 92px;
            height: 92px;
            margin: auto;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: rgba(16, 185, 129, 0.10);
            border: 8px solid rgba(16, 185, 129, 0.18);
            color: #34d399;
            font-size: 19px;
            font-weight: 900;
        }

        .status-circle.down {
            background: rgba(239, 68, 68, 0.10);
            border-color: rgba(239, 68, 68, 0.18);
            color: #f87171;
        }

        .status-title {
            margin-top: 13px;
            font-size: 15px;
            font-weight: 900;
        }

        .status-detail {
            margin-top: 5px;
            color: var(--muted);
            font-size: 10px;
        }

        .summary {
            display: grid;
            gap: 12px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            color: #94a3b8;
            font-size: 10px;
        }

        .summary-row strong {
            color: #e2e8f0;
            font-size: 11px;
        }

        .summary-divider {
            height: 1px;
            background: #1d2c4b;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 680px;
        }

        th,
        td {
            padding: 12px 18px;
            border-bottom: 1px solid #1d2c4b;
            text-align: left;
            font-size: 10px;
        }

        th {
            color: #64748b;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        td {
            color: #cbd5e1;
            font-weight: 600;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 8px;
            border-radius: 999px;
            font-size: 9px;
            font-weight: 900;
        }

        .badge.up {
            color: #34d399;
            background: rgba(16, 185, 129, 0.12);
        }

        .badge.down {
            color: #f87171;
            background: rgba(239, 68, 68, 0.12);
        }

        .badge.unknown {
            color: #fbbf24;
            background: rgba(245, 158, 11, 0.12);
        }

        .empty {
            padding: 35px;
            text-align: center;
            color: var(--muted);
            font-size: 11px;
        }

        .error {
            padding: 30px;
            text-align: center;
            color: #fca5a5;
            font-size: 12px;
        }

        .error strong {
            display: block;
            color: #f87171;
            margin-bottom: 6px;
        }

        .loading {
            min-height: 300px;
            display: grid;
            place-items: center;
            color: var(--muted);
            font-size: 12px;
        }

        .loader {
            width: 28px;
            height: 28px;
            border: 3px solid #243553;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        .last-update {
            color: #64748b;
            font-size: 9px;
            text-align: right;
            margin-top: 8px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 1050px) {
            .metrics {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 720px) {
            .layout {
                display: block;
            }

            .sidebar {
                width: 100%;
                border-right: 0;
                border-bottom: 1px solid var(--border);
                padding: 12px;
            }

            .brand {
                padding-bottom: 12px;
            }

            .menu-label {
                display: none;
            }

            .nav {
                grid-template-columns: repeat(4, 1fr);
            }

            .nav a {
                justify-content: center;
                font-size: 9px;
            }

            .main {
                padding: 18px;
            }

            .topbar {
                flex-direction: column;
            }

            .top-actions {
                width: 100%;
                justify-content: stretch;
            }

            .top-actions .btn {
                flex: 1;
            }

            .toolbar {
                align-items: flex-start;
                flex-direction: column;
            }
        }

        @media (max-width: 480px) {
            .metrics {
                grid-template-columns: 1fr;
            }

            .nav a span {
                display: none;
            }
        }

<script>
    const token = localStorage.getItem("access_token");

    if (!token) {
        window.location.href = "/app/user_login.html";
    }

    let monitors = [];
    let selectedMonitorId = null;
    let latencyChart = null;
    let uptimeChart = null;
    let refreshTimer = null;
    let firstLoad = true;

    function goBack() {
        window.location.href = "/app/dashboard.html";
    }

    function authHeaders() {
        return {
            "Authorization": "Bearer " + token,
            "Accept": "application/json"
        };
    }

    async function apiFetch(url) {
        const response = await fetch(url, {
            method: "GET",
            headers: authHeaders()
        });

        if (response.status === 401 || response.status === 403) {
            localStorage.removeItem("access_token");
            localStorage.removeItem("refresh_token");
            window.location.href = "/app/user_login.html";
            throw new Error("Session expired.");
        }

        if (!response.ok) {
            throw new Error("Request returned HTTP " + response.status);
        }

        return response.json();
    }


    /*
     * Build the charts from the real APILog records.  The analytics
     * summary endpoint can contain a compact/legacy history series, which
     * is not reliable enough for a visual timeline.  The Logs endpoint
     * exposes the actual monitoring checks, so use those records for the
     * chart whenever they are available.
     */
    async function loadRealChartChecks(monitorId) {
        const allChecks = [];
        let page = 1;
        const pageSize = 100;

        while (page <= 100) {
            const response = await apiFetch(
                "/api/monitoring/"
                + encodeURIComponent(monitorId)
                + "/logs/?page="
                + page
                + "&page_size="
                + pageSize
            );

            const rows = Array.isArray(response)
                ? response
                : Array.isArray(response.results)
                    ? response.results
                    : [];

            allChecks.push(...rows);

            const totalPages = Number(response.total_pages || 1);
            if (!rows.length || page >= totalPages) {
                break;
            }

            page += 1;
        }

        return allChecks;
    }

    function buildRealChartHistory(checks, period) {
        if (!Array.isArray(checks) || !checks.length) {
            return [];
        }

        const now = Date.now();
        const lookbackMs =
            period === "24h"
                ? 24 * 60 * 60 * 1000
                : period === "30d"
                    ? 30 * 24 * 60 * 60 * 1000
                    : 7 * 24 * 60 * 60 * 1000;

        const startMs = now - lookbackMs;

        const filtered = checks
            .map(check => ({
                ...check,
                _date: new Date(
                    check.checked_at ??
                    check.timestamp ??
                    check.created_at ??
                    check.time ??
                    check.date
                )
            }))
            .filter(check =>
                !Number.isNaN(check._date.getTime()) &&
                check._date.getTime() >= startMs &&
                check._date.getTime() <= now
            )
            .sort((a, b) => a._date - b._date);

        if (!filtered.length) {
            return [];
        }

        // Keep enough real points to show actual variation without making
        // the chart unreadably dense.  These are averages of actual checks,
        // not generated/synthetic values.
        const bucketMs =
            period === "24h"
                ? 30 * 60 * 1000
                : period === "30d"
                    ? 12 * 60 * 60 * 1000
                    : 3 * 60 * 60 * 1000;

        const buckets = new Map();

        filtered.forEach(check => {
            const timestamp = check._date.getTime();
            const bucketStart =
                Math.floor(timestamp / bucketMs) * bucketMs;

            if (!buckets.has(bucketStart)) {
                buckets.set(bucketStart, {
                    latencies: [],
                    total: 0,
                    up: 0,
                    down: 0
                });
            }

            const bucket = buckets.get(bucketStart);
            bucket.total += 1;

            const status = String(check.status || "").toUpperCase();
            if (status === "UP") {
                bucket.up += 1;
            } else {
                bucket.down += 1;
            }

            const latency = numberOrNull(
                check.response_time_ms ??
                check.response_time ??
                check.responseTime ??
                check.latency ??
                check.response_ms
            );

            if (latency !== null) {
                bucket.latencies.push(latency);
            }
        });

        return Array.from(buckets.entries())
            .sort((a, b) => a[0] - b[0])
            .map(([timestamp, bucket]) => ({
                timestamp: new Date(timestamp).toISOString(),
                latency: bucket.latencies.length
                    ? Number((
                        bucket.latencies.reduce(
                            (sum, value) => sum + value,
                            0
                        ) / bucket.latencies.length
                    ).toFixed(1))
                    : null,
                uptime: bucket.total
                    ? Number((
                        (bucket.up / bucket.total) * 100
                    ).toFixed(2))
                    : null,
                checks: bucket.total,
                up_checks: bucket.up,
                down_checks: bucket.down
            }));
    }

    async function loadMonitorList() {
        const data = await apiFetch("/api/monitoring/analytics/");

        monitors = Array.isArray(data)
            ? data
            : (Array.isArray(data.monitors) ? data.monitors : []);

        const select = document.getElementById("monitorSelect");

        if (!monitors.length) {
            select.innerHTML = `<option value="">No APIs available</option>`;
            document.getElementById("content").innerHTML = `
                <div class="card">
                    <div class="empty">
                        No monitored APIs are available for this account.
                    </div>
                </div>
            `;
            return false;
        }

        select.innerHTML = monitors.map(monitor => `
            <option value="${escapeAttribute(monitor.monitor_id)}">
                ${escapeHTML(monitor.name || "Unnamed API")}
            </option>
        `).join("");

        const params = new URLSearchParams(window.location.search);
        const urlMonitorId = params.get("monitor_id");

        selectedMonitorId =
            monitors.some(m => String(m.monitor_id) === String(urlMonitorId))
                ? String(urlMonitorId)
                : String(monitors[0].monitor_id);

        select.value = selectedMonitorId;

        return true;
    }

    function selectMonitor() {
        selectedMonitorId =
            document.getElementById("monitorSelect").value;

        const url = new URL(window.location.href);

        if (selectedMonitorId) {
            url.searchParams.set("monitor_id", selectedMonitorId);
        } else {
            url.searchParams.delete("monitor_id");
        }

        window.history.replaceState({}, "", url);

        loadSelectedAnalytics();
    }

    async function loadSelectedAnalytics(showLoader = firstLoad) {
        if (!selectedMonitorId) {
            return;
        }

        const period =
            document.getElementById("periodSelect").value;

        const currentUrl = new URL(window.location.href);
        currentUrl.searchParams.set("period", period);

        if (selectedMonitorId) {
            currentUrl.searchParams.set("monitor_id", selectedMonitorId);
        }

        window.history.replaceState({}, "", currentUrl);

        const content = document.getElementById("content");
        const refreshBtn = document.getElementById("refreshBtn");

        if (showLoader) {
            content.innerHTML = `
                <div class="loading">
                    <div>
                        <div class="loader"></div>
                        Loading analytics...
                    </div>
                </div>
            `;
        }

        refreshBtn.textContent = "↻ Loading...";
        refreshBtn.disabled = true;

        try {
            /*
             * The current backend uses the collection endpoint for both
             * monitor selection and detailed analytics. The selected
             * monitor and period are passed as query parameters.
             */
            const data = await apiFetch(
                "/api/monitoring/analytics/"
                + encodeURIComponent(selectedMonitorId)
                + "/?period="
                + encodeURIComponent(period)
            );

            /*
             * Some backend versions return the calculated values inside
             * data / analytics / result.  renderAnalytics below handles
             * both nested and flat responses.
             */
            renderAnalytics(data, monitors, selectedMonitorId);

            // Replace any compact/legacy history with the real APILog
            // timeline.  Summary cards still come from the analytics API.
            try {
                const realChecks = await loadRealChartChecks(selectedMonitorId);
                const realHistory = buildRealChartHistory(realChecks, period);

                if (realHistory.length > 1) {
                    drawCharts(normalizeHistoryForChart(realHistory));
                }
            } catch (chartError) {
                // Keep the analytics response visible if the chart-only
                // logs request fails.
                console.warn("Real chart history unavailable:", chartError);
            }

            firstLoad = false;

        } catch (error) {
            console.error("Analytics error:", error);

            if (showLoader) {
                content.innerHTML = `
                    <div class="card">
                        <div class="error">
                            <strong>Unable to load analytics</strong>
                            ${escapeHTML(error.message)}
                        </div>
                    </div>
                `;
            }

        } finally {
            refreshBtn.textContent = "↻ Refresh";
            refreshBtn.disabled = false;
        }
    }

    function changeResponsePeriod() {
        const responseSelect = document.getElementById("responsePeriodSelect");
        const periodSelect = document.getElementById("periodSelect");

        if (!responseSelect || !periodSelect) return;

        periodSelect.value = responseSelect.value;

        const url = new URL(window.location.href);
        url.searchParams.set("period", responseSelect.value);

        if (selectedMonitorId) {
            url.searchParams.set("monitor_id", selectedMonitorId);
        }

        window.history.replaceState({}, "", url);
        loadSelectedAnalytics(true);
    }

    async function refreshAnalytics() {
        if (!selectedMonitorId) {
            await initialLoad();
            return;
        }

        await loadSelectedAnalytics(false);
    }

    async function initialLoad() {
        try {
            const params = new URLSearchParams(window.location.search);
            const urlPeriod = params.get("period");
            const periodSelect = document.getElementById("periodSelect");

            if (periodSelect && ["24h", "7d", "30d"].includes(urlPeriod)) {
                periodSelect.value = urlPeriod;
            }

            const hasMonitors = await loadMonitorList();

            if (hasMonitors) {
                await loadSelectedAnalytics(true);
            }
        } catch (error) {
            console.error("Analytics initialization error:", error);

            document.getElementById("content").innerHTML = `
                <div class="card">
                    <div class="error">
                        <strong>Unable to load APIs</strong>
                        ${escapeHTML(error.message)}
                    </div>
                </div>
            `;
        }
    }

    function renderAnalytics(data, monitorList = [], currentMonitorId = null) {
        const root = data && typeof data === "object"
            ? data
            : {};

        /*
         * Accept the response shapes used by the monitoring backend:
         * flat, {data:{...}}, {analytics:{...}}, or {result:{...}}.
         */
        const source =
            root.data && typeof root.data === "object"
                ? root.data
                : root.analytics && typeof root.analytics === "object"
                    ? root.analytics
                    : root.result && typeof root.result === "object"
                        ? root.result
                        : root;

        const stats =
            source.stats ||
            source.metrics ||
            source.summary ||
            source;

        let history =
            Array.isArray(source.history)
                ? source.history
                : Array.isArray(source.data_points)
                    ? source.data_points
                    : Array.isArray(source.datapoints)
                        ? source.datapoints
                        : Array.isArray(source.timeline)
                            ? source.timeline
                            : Array.isArray(source.series)
                                ? source.series
                                : Array.isArray(root.history)
                                    ? root.history
                                    : [];

        const legacyHistory =
            Array.isArray(source.response_time_history)
                ? source.response_time_history
                : Array.isArray(root.response_time_history)
                    ? root.response_time_history
                    : [];

        const checks =
            Array.isArray(source.checks)
                ? source.checks
                : Array.isArray(source.logs)
                    ? source.logs
                    : Array.isArray(source.results)
                        ? source.results
                        : Array.isArray(source.recent_history)
                            ? source.recent_history
                            : Array.isArray(root.checks)
                                ? root.checks
                                : Array.isArray(root.recent_history)
                                    ? root.recent_history
                                    : [];

        /*
         * The backend can return the summary correctly while omitting
         * "history". In that case build the graph from the actual
         * monitoring checks instead of displaying a blank chart.
         */
        if (!history.length && legacyHistory.length) {
            history = legacyHistory;
        }

        const periodForHistory =
            document.getElementById("periodSelect")?.value || "7d";

        const normalizedCandidateHistory =
            normalizeHistoryForChart(history);

        const hasLatencyData = normalizedCandidateHistory.some(item =>
            numberOrNull(
                item.latency ??
                item.response_time_ms ??
                item.response_time ??
                item.responseTime ??
                item.response_ms ??
                item.value
            ) !== null
        );

        const hasUptimeData = normalizedCandidateHistory.some(item =>
            numberOrNull(
                item.uptime ??
                item.uptime_percentage ??
                item.availability
            ) !== null
        );

        /*
         * The backend history contains one bucket per time interval.
         * Empty buckets can legitimately have null latency/uptime.
         * If the returned history has no usable measurements at all,
         * rebuild the chart from the real monitoring checks.
         */
        if (
            checks.length &&
            (
                !history.length ||
                (!hasLatencyData && !hasUptimeData)
            )
        ) {
            history = buildHistoryFromChecks(checks, periodForHistory);
        }

        const checkRecords = Array.isArray(checks) ? checks : [];

        const responseValues = checkRecords
            .map(check => numberOrNull(
                check.response_time_ms ??
                check.response_time ??
                check.responseTime ??
                check.latency ??
                check.response_ms
            ))
            .filter(value => value !== null);

        const explicitResponseTimes =
            Array.isArray(source.response_times)
                ? source.response_times
                : Array.isArray(root.response_times)
                    ? root.response_times
                    : [];

        const p95Values = explicitResponseTimes.length
            ? explicitResponseTimes.map(Number).filter(Number.isFinite)
            : responseValues;

        const successfulFromChecks = checkRecords.filter(check =>
            ["UP", "SUCCESS", "HEALTHY"].includes(
                String(
                    check.status ??
                    check.result ??
                    check.state ??
                    ""
                ).toUpperCase()
            )
        ).length;

        const failedFromChecks = checkRecords.filter(check =>
            ["DOWN", "FAILED", "FAIL", "ERROR", "OFFLINE", "UNHEALTHY"].includes(
                String(
                    check.status ??
                    check.result ??
                    check.state ??
                    ""
                ).toUpperCase()
            )
        ).length;

        const totalFromChecks = checkRecords.length;

        const avgFromChecks = responseValues.length
            ? responseValues.reduce((sum, value) => sum + value, 0)
                / responseValues.length
            : null;

        const sortedResponses = [...p95Values].sort((a, b) => a - b);

        const p95FromChecks = sortedResponses.length
            ? sortedResponses[Math.min(
                sortedResponses.length - 1,
                Math.ceil(sortedResponses.length * 0.95) - 1
            )]
            : null;

        const uptimeFromChecks =
            totalFromChecks > 0
                ? (successfulFromChecks / totalFromChecks) * 100
                : null;

        const selectedMonitor =
            Array.isArray(monitorList)
                ? monitorList.find(
                    monitor =>
                        String(monitor.monitor_id) ===
                        String(currentMonitorId)
                )
                : null;

        const uptime = firstNonEmpty(
            stats.uptime_percentage,
            stats.uptime,
            stats.availability,
            source.uptime_percentage,
            source.uptime,
            source.availability,
            uptimeFromChecks
        );

        const avg = firstNonEmpty(
            stats.avg_response_time,
            stats.average_response_time,
            stats.average_latency,
            stats.avg_latency,
            stats.response_time_avg,
            source.avg_response_time,
            source.average_response_time,
            source.average_latency,
            avgFromChecks
        );

        const p95 = firstNonEmpty(
            stats.p95_latency,
            stats.p95,
            stats.p95_response_time,
            source.p95_latency,
            source.p95,
            p95FromChecks
        );

        const total = firstNonEmpty(
            stats.total_checks,
            stats.total_requests,
            stats.total,
            source.total_checks,
            source.total,
            totalFromChecks || null
        );

        const up = firstNonEmpty(
            stats.up_checks,
            stats.successful_checks,
            stats.successful,
            stats.success_count,
            source.up_checks,
            source.successful_checks,
            successfulFromChecks || null
        );

        const down = firstNonEmpty(
            stats.down_checks,
            stats.failed_checks,
            stats.failed,
            stats.failure_count,
            stats.error_count,
            source.down_checks,
            source.failed_checks,
            failedFromChecks || null
        );

        const threshold = firstNonEmpty(
            stats.response_time_threshold_ms,
            stats.threshold_ms,
            source.response_time_threshold_ms,
            source.threshold_ms,
            selectedMonitor?.response_time_threshold_ms,
            selectedMonitor?.threshold_ms
        );

        const status = String(
            firstNonEmpty(
                source.status,
                source.monitor_status,
                source.current_status,
                selectedMonitor?.status,
                selectedMonitor?.monitor_status,
                ""
            ) || ""
        ).toUpperCase();

        const isDown =
            status === "DOWN" ||
            status === "FAILED" ||
            status === "FAIL" ||
            status === "ERROR" ||
            status === "OFFLINE" ||
            status === "UNHEALTHY";

        const displayName = firstNonEmpty(
            source.name,
            source.monitor_name,
            source.api_name,
            selectedMonitor?.name,
            root.name,
            "API"
        );

        const displayUrl = firstNonEmpty(
            source.url,
            source.api_url,
            selectedMonitor?.url,
            root.url,
            "API performance and uptime insights."
        );

        document.getElementById("pageTitle").textContent =
            displayName + " Analytics";

        document.getElementById("pageSubtitle").textContent =
            displayUrl;

        document.getElementById("content").innerHTML = `
            <section class="metrics">

                <div class="metric">

                    <div class="metric-value">
                        ${formatPercent(uptime)}

                    <div class="metric-help">
                        ${formatNumber(up)} successful / ${formatNumber(total)} checks
                    </div>
                </div>

                <div class="metric">
                    <div class="metric-label">Average Response</div>
                    <div class="metric-value">
                        ${formatMs(avg)}
                    </div>
                    <div class="metric-help">
                        Average API latency
                    </div>
                </div>

                <div class="metric">
                    <div class="metric-label">P95 Latency</div>
                    <div class="metric-value">
                        ${formatMs(p95)}
                    </div>
                    <div class="metric-help">
                        95% of recorded responses are at or below this value
                    </div>
                </div>

                <div class="metric">
                    <div class="metric-label">Total Checks</div>
                    <div class="metric-value">
                        ${formatNumber(total)}
                    </div>
                    <div class="metric-help">
                        ${formatNumber(down)} failed checks
                    </div>
                </div>

            </section>

            <section class="grid">

                <div class="card">
                    <div class="card-header">
                        <div>
                            <h2 class="card-title">Response Time</h2>
                            <p class="card-subtitle">
                                Average latency for each time bucket
                            </p>
                        </div>

                        <select id="responsePeriodSelect"
                                class="control response-period-control"
                                onchange="changeResponsePeriod()"
                                aria-label="Response time period">
                            <option value="24h">Last 24 hours</option>
                            <option value="7d">Last 7 days</option>
                            <option value="30d">Last 30 days</option>
                        </select>
                    </div>

                    <div class="card-body">
                        <div class="chart-wrap">
                            <canvas id="latencyChart"></canvas>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <div>
                            <h2 class="card-title">Availability</h2>
                            <p class="card-subtitle">
                                Current monitoring state
                            </p>
                        </div>
                    </div>

                    <div class="card-body">
                        <div class="status-panel">

                            <div>
                                <div class="status-circle ${isDown ? "down" : ""}">
                                    ${isDown ? "DOWN" : "UP"}
                                </div>

                                <div class="status-title">
                                    ${isDown
                                        ? "API needs attention"
                                        : "API is healthy"}
                                </div>

                                <div class="status-detail">
                                    ${formatPercent(uptime)} uptime
                                    · ${formatNumber(down)} failed checks
                                </div>
                            </div>

                        </div>
                    </div>
                </div>

            </section>

            <section class="grid">

                <div class="card">
                    <div class="card-header">
                        <div>
                            <h2 class="card-title">Uptime History</h2>
                            <p class="card-subtitle">
                                Availability percentage across the selected period
                            </p>
                        </div>
                    </div>

                    <div class="card-body">
                        <div class="mini-chart">
                            <canvas id="uptimeChart"></canvas>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <div>
                            <h2 class="card-title">Performance Summary</h2>
                            <p class="card-subtitle">
                                Selected API configuration
                            </p>
                        </div>
                    </div>

                    <div class="card-body">
                        <div class="summary">

                            <div class="summary-row">
                                <span>Current status</span>
                                <strong>
                                    <span class="badge ${isDown ? "down" : "up"}">
                                        ${isDown ? "● DOWN" : "● UP"}
                                    </span>
                                </strong>
                            </div>

                            <div class="summary-row">
                                <span>Slow threshold</span>
                                <strong>${formatMs(threshold)}</strong>
                            </div>

                            <div class="summary-row">
                                <span>Average response</span>
                                <strong>${formatMs(avg)}</strong>
                            </div>

                            <div class="summary-row">
                                <span>P95 latency</span>
                                <strong>${formatMs(p95)}</strong>
                            </div>

                            <div class="summary-divider"></div>

                            <div class="summary-row">
                                <span>Successful checks</span>
                                <strong>${formatNumber(up)}</strong>
                            </div>

                            <div class="summary-row">
                                <span>Failed checks</span>
                                <strong>${formatNumber(down)}</strong>
                            </div>

                            <div class="summary-row">
                                <span>Availability</span>
                                <strong>${formatPercent(uptime)}</strong>
                            </div>

                        </div>
                    </div>
                </div>

            </section>

            <section class="card">

                <div class="card-header">
                    <div>
                        <h2 class="card-title">Recent Monitoring Checks</h2>
                        <p class="card-subtitle">
                            Latest response and status measurements
                        </p>
                    </div>
                </div>

                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Time</th>
                                <th>Status</th>
                                <th>Response</th>
                                <th>HTTP Status</th>
                                <th>Message</th>
                            </tr>
                        </thead>

                        <tbody id="checksBody"></tbody>
                    </table>
                </div>

            </section>

            <div class="last-update">
                Last updated: ${formatDateTime(new Date())}
            </div>
        `;

        const activePeriod = document.getElementById("periodSelect").value;
        const responsePeriodSelect = document.getElementById("responsePeriodSelect");

        if (responsePeriodSelect) {
            responsePeriodSelect.value = activePeriod;
        }

        drawCharts(normalizeHistoryForChart(history));
        renderChecks(normalizeChecksForTable(checks));
    }

    function firstNonEmpty(...values) {
        for (const value of values) {
            if (
                value !== null &&
                value !== undefined &&
                value !== ""
            ) {
                return value;
            }
        }
        return null;
    }

    function buildHistoryFromChecks(checks, period) {
        if (!Array.isArray(checks) || !checks.length) {
            return [];
        }

        const bucketMs =
            period === "24h"
                ? 30 * 60 * 1000
                : period === "30d"
                    ? 12 * 60 * 60 * 1000
                    : 3 * 60 * 60 * 1000;

        const buckets = new Map();

        checks.forEach(check => {
            const rawTime =
                check.checked_at ??
                check.timestamp ??
                check.created_at ??
                check.time ??
                check.date;

            const date = new Date(rawTime);

            if (Number.isNaN(date.getTime())) {
                return;
            }

            const key =
                Math.floor(date.getTime() / bucketMs) * bucketMs;

            if (!buckets.has(key)) {
                buckets.set(key, {
                    latencies: [],
                    total: 0,
                    up: 0
                });
            }

            const bucket = buckets.get(key);
            bucket.total += 1;

            const status = String(
                check.status ??
                check.result ??
                check.state ??
                ""
            ).toUpperCase();

            if (
                status === "UP" ||
                status === "SUCCESS" ||
                status === "HEALTHY"
            ) {
                bucket.up += 1;
            }

            const latency = numberOrNull(
                check.response_time_ms ??
                check.response_time ??
                check.responseTime ??
                check.latency ??
                check.response_ms
            );

            if (latency !== null) {
                bucket.latencies.push(latency);
            }
        });

        return Array.from(buckets.entries())
            .sort((a, b) => a[0] - b[0])
            .map(([timestamp, bucket]) => ({
                timestamp: new Date(timestamp).toISOString(),
                latency: bucket.latencies.length
                    ? Number(
                        (
                            bucket.latencies.reduce(
                                (sum, value) => sum + value,
                                0
                            ) / bucket.latencies.length
                        ).toFixed(1)
                    )
                    : null,
                uptime: bucket.total
                    ? Number(
                        ((bucket.up / bucket.total) * 100).toFixed(2)
                    )
                    : null,
                checks: bucket.total,
                up_checks: bucket.up,
                down_checks: bucket.total - bucket.up
            }));
    }

    function normalizeHistoryForChart(history) {
        if (!Array.isArray(history)) {
            return [];
        }

        return history.map((item, index) => {
            if (typeof item === "number") {
                return {
                    timestamp: String(index + 1),
                    latency: item,
                    uptime: null
                };
            }

            const obj = item || {};

            return {
                timestamp: firstNonEmpty(
                    obj.timestamp,
                    obj.checked_at,
                    obj.created_at,
                    obj.time,
                    obj.date,
                    obj.label,
                    String(index + 1)
                ),
                latency: firstNonEmpty(
                    obj.latency,
                    obj.response_time_ms,
                    obj.response_time,
                    obj.responseTime,
                    obj.response_ms,
                    obj.value
                ),
                uptime: firstNonEmpty(
                    obj.uptime_percentage,
                    obj.uptime,
                    obj.availability
                )
            };
        });
    }

    function normalizeChecksForTable(checks) {
        if (!Array.isArray(checks)) {
            return [];
        }

        return checks.slice(0, 15).map(item => {
            const obj = item || {};

            return {
                checked_at: firstNonEmpty(
                    obj.checked_at,
                    obj.timestamp,
                    obj.created_at,
                    obj.time,
                    obj.date
                ),
                status: String(
                    firstNonEmpty(
                        obj.status,
                        obj.result,
                        obj.state,
                        ""
                    ) || ""
                ).toUpperCase(),
                response_time_ms: firstNonEmpty(
                    obj.response_time_ms,
                    obj.response_time,
                    obj.responseTime,
                    obj.latency,
                    obj.response_ms
                ),
                status_code: firstNonEmpty(
                    obj.status_code,
                    obj.http_status,
                    obj.response_status,
                    obj.code
                ),
                error_message: firstNonEmpty(
                    obj.error_message,
                    obj.message,
                    obj.error,
                    obj.detail,
                    ""
                )
            };
        });
    }

    function drawCharts(history) {
        if (typeof Chart === "undefined") {
            return;
        }

        if (latencyChart) {
            latencyChart.destroy();
        }

        if (uptimeChart) {
            uptimeChart.destroy();
        }

        const labels = history.map(item =>
            formatChartLabel(
                item.timestamp ??
                item.checked_at ??
                item.time ??
                item.date ??
                item.label
            )
        );

        const latencyValues = history.map(item =>
            numberOrNull(
                item.latency ??
                item.response_time_ms ??
                item.response_time ??
                item.responseTime ??
                item.response_ms ??
                item.value
            )
        );

        const uptimeValues = history.map(item =>
            numberOrNull(
                item.uptime ??
                item.uptime_percentage ??
                item.availability
            )
        );

        const latencyCanvas =
            document.getElementById("latencyChart");

        const uptimeCanvas =
            document.getElementById("uptimeChart");

        if (latencyCanvas) {
            latencyChart = new Chart(
                latencyCanvas,
                {
                    type: "line",
                    data: {
                        labels: labels.length ? labels : ["No data"],
                        datasets: [{
                            label: "Response time",
                            data: latencyValues.length
                                ? latencyValues
                                : [0],
                            borderColor: "#7c6cff",
                            backgroundColor: "rgba(124,108,255,0.12)",
                            fill: true,
                            tension: 0.22,
                            pointRadius: 2.5,
                            pointHoverRadius: 6,
                            spanGaps: false
                        }]
                    },
                    options: chartOptions("ms")
                }
            );
        }

        if (uptimeCanvas) {
            uptimeChart = new Chart(
                uptimeCanvas,
                {
                    type: "line",
                    data: {
                        labels: labels.length ? labels : ["No data"],
                        datasets: [{
                            label: "Uptime",
                            data: uptimeValues.length
                                ? uptimeValues
                                : [0],
                            borderColor: "#10b981",
                            backgroundColor: "rgba(16,185,129,0.10)",
                            fill: true,
                            tension: 0.22,
                            pointRadius: 2.5,
                            pointHoverRadius: 6,
                            spanGaps: false
                        }]
                    },
                    options: chartOptions("%", 100)
                }
            );
        }
    }

    function chartOptions(unit, maxY = null) {
        return {
            responsive: true,
            maintainAspectRatio: false,

            interaction: {
                intersect: false,
                mode: "index"
            },

            plugins: {
                legend: {
                    display: false
                },

                tooltip: {
                    callbacks: {
                        label: function(context) {
                            const value = context.parsed.y;

                            if (value === null || value === undefined) {
                                return " No data";
                            }

                            return " "
                                + (unit === "%"
                                    ? Number(value).toFixed(1) + "%"
                                    : formatMs(value));
                        }
                    }
                }
            },

            scales: {
                x: {
                    grid: {
                        color: "rgba(148,163,184,0.07)"
                    },

                    ticks: {
                        color: "#64748b",
                        font: {
                            size: 9
                        },
                        maxTicksLimit: 8,
                        maxRotation: 0
                    }
                },

                y: {
                    beginAtZero: true,
                    suggestedMax: maxY,

                    grid: {
                        color: "rgba(148,163,184,0.08)"
                    },

                    ticks: {
                        color: "#64748b",
                        font: {
                            size: 9
                        },

                        callback: function(value) {
                            return unit === "%"
                                ? value + "%"
                                : formatMs(value);
                        }
                    }
                }
            }
        };
    }

    function renderChecks(checks) {
        const body = document.getElementById("checksBody");

        if (!body) {
            return;
        }

        if (!checks.length) {
            body.innerHTML = `
                <tr>
                    <td colspan="5">
                        <div class="empty">
                            No monitoring checks in the selected period.
                        </div>
                    </td>
                </tr>
            `;
            return;
        }

        body.innerHTML = checks.map(check => {
            const isUp = String(check.status || "").toUpperCase() === "UP";

            const badge = isUp
                ? `<span class="badge up">● UP</span>`
                : `<span class="badge down">● DOWN</span>`;

            return `
                <tr>
                    <td>${escapeHTML(formatDateTime(check.checked_at))}</td>
                    <td>${badge}</td>
                    <td>${formatMs(check.response_time_ms)}</td>
                    <td>${check.status_code ?? "—"}</td>
                    <td>${escapeHTML(check.error_message || "—")}</td>
                </tr>
            `;
        }).join("");
    }

    function numberOrNull(value) {
        if (
            value === null ||
            value === undefined ||
            value === ""
        ) {
            return null;
        }

        const number = Number(value);

        return Number.isFinite(number)
            ? number
            : null;
    }

    function formatNumber(value) {
        const number = numberOrNull(value);

        if (number === null) {
            return "—";
        }

        return new Intl.NumberFormat("en-IN").format(
            Math.round(number)
        );
    }

    function formatMs(value) {
        const number = numberOrNull(value);

        if (number === null) {
            return "—";
        }

        if (number >= 1000) {
            return (number / 1000).toFixed(2) + " s";
        }

        return Math.round(number).toLocaleString("en-IN") + " ms";
    }

    function formatPercent(value) {
        const number = numberOrNull(value);

        if (number === null) {
            return "—";
        }

        return number.toFixed(2).replace(/\.00$/, "") + "%";
    }

    function formatDateTime(value) {
        if (!value) {
            return "—";
        }

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
            return String(value);
        }

        return date.toLocaleString([], {
            dateStyle: "short",
            timeStyle: "short"
        });
    }

    function formatChartLabel(value) {
        if (!value) {
            return "";
        }

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
            return String(value);
        }

        return date.toLocaleString([], {
            month: "short",
            day: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        });
    }

    function escapeHTML(value) {
        const div = document.createElement("div");
        div.textContent = value ?? "";
        return div.innerHTML;
    }

    function escapeAttribute(value) {
        return escapeHTML(String(value))
            .replace(/"/g, "&quot;");
    }

    initialLoad();

    refreshTimer = setInterval(
        () => loadSelectedAnalytics(false),
        30000
    );
</script>

</body>
