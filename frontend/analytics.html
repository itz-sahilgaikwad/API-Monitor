<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - API Monitor</title>
    <meta name="description" content="Live API monitoring analytics">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg: #f4f7fb;
            --panel: #ffffff;
            --panel-2: #f8fafc;
            --border: #e2e8f0;
            --text: #0f172a;
            --muted: #64748b;
            --primary: #7357ff;
            --primary-2: #8b5cf6;
            --green: #10b981;
            --red: #ef4444;
            --amber: #f59e0b;
            --blue: #38bdf8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at 85% 5%, rgba(115, 87, 255, 0.14), transparent 28%),
                radial-gradient(circle at 10% 90%, rgba(56, 189, 248, 0.07), transparent 24%),
                var(--bg);
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        button,
        select {
            font: inherit;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 178px;
            flex-shrink: 0;
            background: rgba(10, 19, 38, 0.96);
            border-right: 1px solid var(--border);
            padding: 20px 13px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 0 7px 26px;
        }

        .brand-logo {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            color: white;
            font-weight: 900;
            box-shadow: 0 7px 18px rgba(99, 102, 241, 0.25);
        }

        .brand-title {
            font-size: 13px;
            font-weight: 900;
        }

        .brand-subtitle {
            margin-top: 2px;
            color: #64748b;
            font-size: 8px;
        }

        .menu-label {
            padding: 0 8px 8px;
            color: #64748b;
            font-size: 8px;
            font-weight: 800;
            letter-spacing: 0.1em;
        }

        .nav {
            display: grid;
            gap: 4px;
        }

        .nav a {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 9px 10px;
            border-radius: 9px;
            color: #64748b;
            text-decoration: none;
            font-size: 11px;
            font-weight: 700;
        }

        .nav a:hover,
        .nav a.active {
            background: rgba(115, 87, 255, 0.18);
            color: #c4b5fd;
        }

        .main {
            flex: 1;
            min-width: 0;
            padding: 28px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 20px;
        }

        .eyebrow {
            margin-bottom: 5px;
            color: #8b7cff;
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }

        h1 {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 29px;
            letter-spacing: -0.03em;
        }

        .subtitle {
            margin: 7px 0 0;
            color: var(--muted);
            font-size: 12px;
            word-break: break-all;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 9px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .control {
            height: 38px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--panel);
            color: #e2e8f0;
            padding: 0 12px;
            outline: none;
            font-size: 11px;
            font-weight: 800;
        }

        .control:focus {
            border-color: var(--primary);
        }

        .btn {
            height: 38px;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0 14px;
            background: var(--panel);
            color: #dbe4f0;
            cursor: pointer;
            font-size: 11px;
            font-weight: 800;
        }

        .btn:hover {
            border-color: #53678f;
        }

        .btn-primary {
            border-color: transparent;
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            color: white;
            box-shadow: 0 7px 18px rgba(99, 102, 241, 0.22);
        }

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: rgba(13, 22, 43, 0.88);
        }

        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .toolbar-label {
            color: var(--muted);
            font-size: 10px;
            font-weight: 800;
        }

        .live {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #86efac;
            font-size: 10px;
            font-weight: 800;
        }

        .live-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.10);
        }

        .metrics {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 14px;
            margin-bottom: 16px;
        }

        .metric {
            position: relative;
            overflow: hidden;
            min-height: 116px;
            background: rgba(13, 22, 43, 0.96);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px;
        }

        .metric::after {
            content: "";
            position: absolute;
            right: -24px;
            bottom: -28px;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(115, 87, 255, 0.07);
        }

        .metric-label {
            color: #a5b4c8;
            font-size: 10px;
            font-weight: 800;
        }

        .metric-value {
            margin-top: 10px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 25px;
            font-weight: 900;
            letter-spacing: -0.03em;
        }

        .metric-help {
            margin-top: 5px;
            color: #64748b;
            font-size: 9px;
        }

        .grid {
            display: grid;
            grid-template-columns: minmax(0, 1.35fr) minmax(290px, 0.65fr);
            gap: 16px;
            margin-bottom: 16px;
        }

        .card {
            background: rgba(13, 22, 43, 0.96);
            border: 1px solid var(--border);
            border-radius: 15px;
            overflow: hidden;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 16px 18px;
            border-bottom: 1px solid #e2e8f0;
        }

        .card-title {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 15px;
            font-weight: 900;
        }

        .card-subtitle {
            margin: 4px 0 0;
            color: #64748b;
            font-size: 10px;
        }

        .card-body {
            padding: 18px;
        }

        .chart-wrap {
            height: 330px;
        }

        .mini-chart {
            height: 235px;
        }

        .status-panel {
            min-height: 235px;
            display: grid;
            place-items: center;
            text-align: center;
        }

        .status-circle {
            width: 92px;
            height: 92px;
            margin: auto;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: rgba(16, 185, 129, 0.10);
            border: 8px solid rgba(16, 185, 129, 0.18);
            color: #34d399;
            font-size: 19px;
            font-weight: 900;
        }

        .status-circle.down {
            background: rgba(239, 68, 68, 0.10);
            border-color: rgba(239, 68, 68, 0.18);
            color: #f87171;
        }

        .status-title {
            margin-top: 13px;
            font-size: 15px;
            font-weight: 900;
        }

        .status-detail {
            margin-top: 5px;
            color: var(--muted);
            font-size: 10px;
        }

        .summary {
            display: grid;
            gap: 12px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            color: #64748b;
            font-size: 10px;
        }

        .summary-row strong {
            color: #e2e8f0;
            font-size: 11px;
        }

        .summary-divider {
            height: 1px;
            background: #e2e8f0;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 680px;
        }

        th,
        td {
            padding: 12px 18px;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
            font-size: 10px;
        }

        th {
            color: #64748b;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        td {
            color: #cbd5e1;
            font-weight: 600;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 8px;
            border-radius: 999px;
            font-size: 9px;
            font-weight: 900;
        }

        .badge.up {
            color: #34d399;
            background: rgba(16, 185, 129, 0.12);
        }

        .badge.down {
            color: #f87171;
            background: rgba(239, 68, 68, 0.12);
        }

        .badge.unknown {
            color: #fbbf24;
            background: rgba(245, 158, 11, 0.12);
        }

        .empty {
            padding: 35px;
            text-align: center;
            color: var(--muted);
            font-size: 11px;
        }

        .error {
            padding: 30px;
            text-align: center;
            color: #fca5a5;
            font-size: 12px;
        }

        .error strong {
            display: block;
            color: #f87171;
            margin-bottom: 6px;
        }

        .loading {
            min-height: 300px;
            display: grid;
            place-items: center;
            color: var(--muted);
            font-size: 12px;
        }

        .loader {
            width: 28px;
            height: 28px;
            border: 3px solid #243553;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        .last-update {
            color: #64748b;
            font-size: 9px;
            text-align: right;
            margin-top: 8px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 1050px) {
            .metrics {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 720px) {
            .layout {
                display: block;
            }

            .sidebar {
                width: 100%;
                border-right: 0;
                border-bottom: 1px solid var(--border);
                padding: 12px;
            }

            .brand {
                padding-bottom: 12px;
            }

            .menu-label {
                display: none;
            }

            .nav {
                grid-template-columns: repeat(4, 1fr);
            }

            .nav a {
                justify-content: center;
                font-size: 9px;
            }

            .main {
                padding: 18px;
            }

            .topbar {
                flex-direction: column;
            }

            .top-actions {
                width: 100%;
                justify-content: stretch;
            }

            .top-actions .btn {
                flex: 1;
            }

            .toolbar {
                align-items: flex-start;
                flex-direction: column;
            }
        }

        @media (max-width: 480px) {
            .metrics {
                grid-template-columns: 1fr;
            }

            .nav a span {
                display: none;
            }
        }
    
        /* Force the Analytics page to match the light Dashboard theme. */
        html {
            color-scheme: light;
            background: #f4f7fb;
        }

        body {
            background:
                radial-gradient(circle at 85% 5%, rgba(115, 87, 255, 0.08), transparent 28%),
                radial-gradient(circle at 10% 90%, rgba(56, 189, 248, 0.05), transparent 24%),
                #f4f7fb;
            color: #0f172a;
        }

        .card,
        .toolbar,
        .summary,
        .control,
        .status-panel,
        .table-wrap {
            background-color: #ffffff;
            color: #0f172a;
        }

        .card-title,
        .metric-value,
        .page-title,
        h1, h2, h3 {
            color: #0f172a;
        }

        .card-subtitle,
        .metric-label,
        .toolbar-label,
        .muted,
        .status-detail {
            color: #64748b;
        }

        .control {
            border-color: #dbe3ee;
        }

        .control:focus {
            border-color: #7c6cff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(124, 108, 255, 0.12);
        }

        /* =========================================================
           ADDITIVE STATUS GRAPHS
           Existing project styling is intentionally preserved.
        ========================================================== */
        .status-graphs-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }

        .status-graph {
            min-width: 0;
        }

        .status-graph .status-chart-wrap {
            height: 220px;
            position: relative;
        }

        .status-graph .status-chart-wrap canvas {
            width: 100% !important;
            height: 100% !important;
        }

        .status-graph-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 18px 14px;
            border-top: 1px solid #e2e8f0;
            font-size: 10px;
            color: #64748b;
        }

        .status-graph-value {
            font-weight: 800;
        }

        .status-graph-value.up {
            color: #10b981;
        }

        .status-graph-value.slow {
            color: #f59e0b;
        }

        .status-graph-value.down {
            color: #ef4444;
        }

        .analytics-color-legend {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            padding: 14px 18px;
            margin-bottom: 16px;
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 15px;
            font-size: 10px;
            color: #475569;
        }

        .analytics-color-legend .legend-item {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-weight: 700;
        }

        .analytics-color-legend .legend-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
        }

        .analytics-color-legend .legend-dot.up {
            background: #10b981;
        }

        .analytics-color-legend .legend-dot.slow {
            background: #f59e0b;
        }

        .analytics-color-legend .legend-dot.down {
            background: #ef4444;
        }

        .analytics-color-legend .legend-explain {
            width: 100%;
            text-align: center;
            color: #64748b;
            font-weight: 500;
        }

        @media (max-width: 900px) {
            .status-graphs-grid {
                grid-template-columns: 1fr;
            }
        }

            ) !important;
            color: var(--primary) !important;
        }

        .system-card {
            margin-top: 24px !important;
            padding: 13px !important;
            border-radius: 10px !important;
            background: #f8fafc !important;

        }

    </style>
</head>

<body>
<div class="layout">

    <aside class="sidebar">
        <div class="brand">
            <div class="brand-logo">A</div>
            <div>
                <div class="brand-title">API Monitor</div>

            </div>
        </div>

        <div class="menu-label">WORKSPACE</div>

        <nav class="nav">

            <a href="/app/logs.html">☷ <span>Logs</span></a>

            <div style="display:flex;align-items:center;gap:8px;color:#334155;font-size:10px;font-weight:800;">
                <span style="width:7px;height:7px;border-radius:50%;background:#10b981;box-shadow:0 0 0 4px rgba(16,185,129,.10);"></span>
                System Online
            </div>
            <div style="margin-top:5px;margin-left:15px;color:#64748b;font-size:9px;">All systems operational</div>
        </div>
    </aside>

    <main class="main">

        <header class="topbar">
            <div>
                <div class="eyebrow">Monitoring analytics</div>
                <h1 id="pageTitle">API Analytics</h1>
                <p class="subtitle" id="pageSubtitle">
                    Select an API to view its performance.
                </p>
            </div>

            <div class="top-actions">
                <button class="btn" onclick="goBack()">← Dashboard</button>
                <button class="btn btn-primary" id="refreshBtn" onclick="refreshAnalytics()">
                    ↻ Refresh
                </button>
            </div>
        </header>

        <div class="toolbar">
            <div class="toolbar-left">

                <select id="monitorSelect" class="control" onchange="selectMonitor()">
                    <option value="">Loading APIs...</option>
                </select>

                <span class="toolbar-label">Period</span>

                <select id="periodSelect" class="control" onchange="loadSelectedAnalytics()">
                    <option value="24h">Last 24 hours</option>
                    <option value="7d" selected>Last 7 days</option>
                    <option value="30d">Last 30 days</option>
                </select>
            </div>

            <div class="live">
                <span class="live-dot"></span>
                LIVE · updates every 30 seconds
            </div>
        </div>

        <section id="content">
            <div class="loading">
                <div>
                    <div class="loader"></div>
                    Loading analytics...
                </div>
            </div>
        </section>

    </main>
</div>

<script>
    const token = localStorage.getItem("access_token");

    if (!token) {
        window.location.href = "/app/user_login.html";
    }

    let monitors = [];
    let selectedMonitorId = null;
    let latencyChart = null;
    let uptimeChart = null;
    let upTimeChart = null;
    let slowTimeChart = null;
    let downTimeChart = null;
    let refreshTimer = null;
    let firstLoad = true;

    function goBack() {
        window.location.href = "/app/dashboard.html";
    }

    function authHeaders() {
        return {
            "Authorization": "Bearer " + token,
            "Accept": "application/json"
        };
    }

    async function apiFetch(url) {
        const response = await fetch(url, {
            method: "GET",
            headers: authHeaders()
        });

        if (response.status === 401 || response.status === 403) {
            localStorage.removeItem("access_token");
            localStorage.removeItem("refresh_token");
            window.location.href = "/app/user_login.html";
            throw new Error("Session expired.");
        }

        if (!response.ok) {
            throw new Error("Request returned HTTP " + response.status);
        }

        return response.json();
    }

    async function loadMonitorList() {
        const data = await apiFetch("/api/monitoring/analytics/");

        monitors = Array.isArray(data)
            ? data
            : (Array.isArray(data.monitors) ? data.monitors : []);

        const select = document.getElementById("monitorSelect");

        if (!monitors.length) {
            select.innerHTML = `<option value="">No APIs available</option>`;
            document.getElementById("content").innerHTML = `
                <div class="card">
                    <div class="empty">
                        No monitored APIs are available for this account.
                    </div>
                </div>
            `;
            return false;
        }

        select.innerHTML = monitors.map(monitor => `
            <option value="${escapeAttribute(monitor.monitor_id)}">
                ${escapeHTML(monitor.name || "Unnamed API")}
            </option>
        `).join("");

        const params = new URLSearchParams(window.location.search);
        const urlMonitorId = params.get("monitor_id");

        selectedMonitorId =
            monitors.some(m => String(m.monitor_id) === String(urlMonitorId))
                ? String(urlMonitorId)
                : String(monitors[0].monitor_id);

        select.value = selectedMonitorId;

        return true;
    }

    function selectMonitor() {
        selectedMonitorId =
            document.getElementById("monitorSelect").value;

        const url = new URL(window.location.href);

        if (selectedMonitorId) {
            url.searchParams.set("monitor_id", selectedMonitorId);
        } else {
            url.searchParams.delete("monitor_id");
        }

        window.history.replaceState({}, "", url);

        loadSelectedAnalytics();
    }

    async function loadSelectedAnalytics(showLoader = firstLoad) {
        if (!selectedMonitorId) {
            return;
        }

        const period =
            document.getElementById("periodSelect").value;

        const content = document.getElementById("content");
        const refreshBtn = document.getElementById("refreshBtn");

        if (showLoader) {
            content.innerHTML = `
                <div class="loading">
                    <div>
                        <div class="loader"></div>
                        Loading analytics...
                    </div>
                </div>
            `;
        }

        refreshBtn.textContent = "↻ Loading...";
        refreshBtn.disabled = true;

        try {
            const data = await apiFetch(
                "/api/monitoring/analytics/"
                + "?monitor_id="
                + encodeURIComponent(selectedMonitorId)
                + "&period="
                + encodeURIComponent(period)
            );

            renderAnalytics(data);
            firstLoad = false;

        } catch (error) {
            console.error("Analytics error:", error);

            if (showLoader) {
                content.innerHTML = `
                    <div class="card">
                        <div class="error">
                            <strong>Unable to load analytics</strong>
                            ${escapeHTML(error.message)}
                        </div>
                    </div>
                `;
            }

        } finally {
            refreshBtn.textContent = "↻ Refresh";
            refreshBtn.disabled = false;
        }
    }

    async function refreshAnalytics() {
        if (!selectedMonitorId) {
            await initialLoad();
            return;
        }

        await loadSelectedAnalytics(false);
    }

    async function initialLoad() {
        try {
            const hasMonitors = await loadMonitorList();

            if (hasMonitors) {
                await loadSelectedAnalytics(true);
            }
        } catch (error) {
            console.error("Analytics initialization error:", error);

            document.getElementById("content").innerHTML = `
                <div class="card">
                    <div class="error">
                        <strong>Unable to load APIs</strong>
                        ${escapeHTML(error.message)}
                    </div>
                </div>
            `;
        }
    }

    function renderAnalytics(data) {
        const uptime = numberOrNull(data.uptime_percentage);
        const avg = numberOrNull(data.avg_response_time);
        const p95 = numberOrNull(data.p95_latency);
        const total = numberOrNull(data.total_checks);
        const up = numberOrNull(data.up_checks);
        const down = numberOrNull(data.down_checks);
        const threshold = numberOrNull(data.response_time_threshold_ms);

        const status = String(data.status || "").toUpperCase();
        const isDown = status === "DOWN";

        document.getElementById("pageTitle").textContent =
            (data.name || "API") + " Analytics";

        document.getElementById("pageSubtitle").textContent =
            data.url || "API performance and uptime insights.";

        document.getElementById("content").innerHTML = `
            <section class="metrics">

                <div class="metric">
                    <div class="metric-label">Uptime</div>
                    <div class="metric-value">
                        ${formatPercent(uptime)}
                    </div>
                    <div class="metric-help">
                        ${formatNumber(up)} successful / ${formatNumber(total)} checks
                    </div>
                </div>

                <div class="metric">
                    <div class="metric-label">Average Response</div>
                    <div class="metric-value">
                        ${formatMs(avg)}
                    </div>
                    <div class="metric-help">
                        Average API latency
                    </div>
                </div>

                <div class="metric">
                    <div class="metric-label">P95 Latency</div>
                    <div class="metric-value">
                        ${formatMs(p95)}
                    </div>
                    <div class="metric-help">
                        95% of recorded responses are at or below this value
                    </div>
                </div>

                <div class="metric">
                    <div class="metric-label">Total Checks</div>
                    <div class="metric-value">
                        ${formatNumber(total)}
                    </div>
                    <div class="metric-help">
                        ${formatNumber(down)} failed checks
                    </div>
                </div>

            </section>

            <section class="grid">

                <div class="card">
                    <div class="card-header">
                        <div>
                            <h2 class="card-title">Response Time</h2>
                            <p class="card-subtitle">
                                Average latency for each time bucket
                            </p>
                        </div>
                    </div>

                    <div class="card-body">
                        <div class="chart-wrap">
                            <canvas id="latencyChart"></canvas>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <div>
                            <h2 class="card-title">Availability</h2>
                            <p class="card-subtitle">
                                Current monitoring state
                            </p>
                        </div>
                    </div>

                    <div class="card-body">
                        <div class="status-panel">

                            <div>
                                <div class="status-circle ${isDown ? "down" : ""}">
                                    ${isDown ? "DOWN" : "UP"}
                                </div>

                                <div class="status-title">
                                    ${isDown
                                        ? "API needs attention"
                                        : "API is healthy"}
                                </div>

                                <div class="status-detail">
                                    ${formatPercent(uptime)} uptime
                                    · ${formatNumber(down)} failed checks
                                </div>
                            </div>

                        </div>
                    </div>
                </div>

            </section>
            <div class="analytics-color-legend" aria-label="Analytics color legend">
                <span class="legend-item">
                    <span class="legend-dot up"></span>
                    UP · Healthy
                </span>
                <span class="legend-item">
                    <span class="legend-dot slow"></span>
                    SLOW · Degraded
                </span>
                <span class="legend-item">
                    <span class="legend-dot down"></span>
                    DOWN · Failed
                </span>
                <div class="legend-explain">
                    Green shows healthy response periods, orange shows responses slower
                    than the configured threshold, and red shows failed checks.
                </div>
            </div>

            <section class="grid">

                <div class="card">
                    <div class="card-header">
                        <div>
                            <h2 class="card-title">API Health Status</h2>
                            <p class="card-subtitle">
                                UP, SLOW and DOWN status across the selected period
                            </p>
                        </div>
                    </div>

                    <div class="card-body">
                        <div class="mini-chart">
                            <canvas id="uptimeChart"></canvas>
                        </div>
                    </div>

                    <div class="analytics-color-legend" aria-label="API health status legend">
                        <span class="legend-item">
                            <span class="legend-dot up"></span>
                            UP · Healthy
                        </span>
                        <span class="legend-item">
                            <span class="legend-dot slow"></span>
                            SLOW · Degraded
                        </span>
                        <span class="legend-item">
                            <span class="legend-dot down"></span>
                            DOWN · Failed
                        </span>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <div>
                            <h2 class="card-title">Performance Summary</h2>
                            <p class="card-subtitle">
                                Selected API configuration
                            </p>
                        </div>
                    </div>

                    <div class="card-body">
                        <div class="summary">

                            <div class="summary-row">
                                <span>Current status</span>
                                <strong>
                                    <span class="badge ${isDown ? "down" : "up"}">
                                        ${isDown ? "● DOWN" : "● UP"}
                                    </span>
                                </strong>
                            </div>

                            <div class="summary-row">
                                <span>Slow threshold</span>
                                <strong>${formatMs(threshold)}</strong>
                            </div>

                            <div class="summary-row">
                                <span>Average response</span>
                                <strong>${formatMs(avg)}</strong>
                            </div>

                            <div class="summary-row">
                                <span>P95 latency</span>
                                <strong>${formatMs(p95)}</strong>
                            </div>

                            <div class="summary-divider"></div>

                            <div class="summary-row">
                                <span>Successful checks</span>
                                <strong>${formatNumber(up)}</strong>
                            </div>

                            <div class="summary-row">
                                <span>Failed checks</span>
                                <strong>${formatNumber(down)}</strong>
                            </div>

                            <div class="summary-row">
                                <span>Availability</span>
                                <strong>${formatPercent(uptime)}</strong>
                            </div>

                        </div>
                    </div>
                </div>

            </section>

            <section class="card">

                <div class="card-header">
                    <div>
                        <h2 class="card-title">Recent Monitoring Checks</h2>
                        <p class="card-subtitle">
                            Latest response and status measurements
                        </p>
                    </div>
                </div>

                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Time</th>
                                <th>Status</th>
                                <th>Response</th>
                                <th>HTTP Status</th>
                                <th>Message</th>
                            </tr>
                        </thead>

                        <tbody id="checksBody"></tbody>
                    </table>
                </div>

            </section>

            <div class="last-update">
                Last updated: ${formatDateTime(new Date())}
            </div>
        `;

        drawCharts(data.history || [], threshold);
        renderChecks(data.checks || []);
    }

    function getHistoryLatency(item) {
        if (!item || typeof item !== "object") {
            return null;
        }

        return numberOrNull(
            item.latency ??
            item.response_time_ms ??
            item.response_time ??
            item.responseTime ??
            item.response_ms ??
            item.value
        );
    }

    function drawCharts(history, threshold) {
        if (!Array.isArray(history)) {
            history = [];
        }

        if (latencyChart) {
            latencyChart.destroy();
            latencyChart = null;
        }

        if (uptimeChart) {
            uptimeChart.destroy();
            uptimeChart = null;
        }

        const labels = history.map(item =>
            formatChartLabel(
                item?.timestamp ??
                item?.checked_at ??
                item?.time ??
                item?.date ??
                item?.label
            )
        );

        const latencyValues = history.map(item =>
            getHistoryLatency(item)
        );

        const states = history.map(item =>
            statusForBucket(item, threshold)
        );

        const upValues = states.map(state =>
            state === "up" ? 3 : null
        );

        const slowValues = states.map(state =>
            state === "slow" ? 2 : null
        );

        const downValues = states.map(state =>
            state === "down" ? 1 : null
        );

        const latencyCanvas =
            document.getElementById("latencyChart");

        const uptimeCanvas =
            document.getElementById("uptimeChart");

        /*
         * Use Chart.js when it is available.
         * If the CDN is blocked/unavailable, use the native SVG renderer
         * below so the Analytics graphs never remain blank.
         */
        if (typeof Chart === "undefined") {
            drawNativeLatencyChart(
                latencyCanvas,
                labels,
                latencyValues
            );

            drawNativeStatusChart(
                uptimeCanvas,
                labels,
                states
            );

            return;
        }

        if (latencyCanvas) {
            const latencyWrapper = latencyCanvas.parentElement;
            const nativeLatency = latencyWrapper
                ? latencyWrapper.querySelector(".native-analytics-chart")
                : null;

            if (nativeLatency) {
                nativeLatency.remove();
            }

            latencyCanvas.style.display = "";

            latencyChart = new Chart(
                latencyCanvas,
                {
                    type: "line",
                    data: {
                        labels: labels.length
                            ? labels
                            : ["No data"],
                        datasets: [{
                            label: "Average response",
                            data: latencyValues.length
                                ? latencyValues
                                : [null],
                            borderColor: "#7467ff",
                            backgroundColor: "rgba(116,103,255,0.12)",
                            fill: true,
                            tension: 0.28,
                            spanGaps: false,
                            pointRadius: 2.5,
                            pointHoverRadius: 5,
                            pointBackgroundColor: "#7467ff",
                            pointBorderColor: "#ffffff",
                            pointBorderWidth: 1.5,
                            borderWidth: 3
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: {
                            intersect: false,
                            mode: "index"
                        },
                        plugins: {
                            legend: {
                                display: false
                            },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        return " Response: " +
                                            formatMs(context.parsed.y);
                                    }
                                }
                            }
                        },
                        scales: {
                            x: {
                                grid: {
                                    color: "rgba(148,163,184,0.07)"
                                },
                                ticks: {
                                    color: "#94a3b8",
                                    font: {
                                        size: 9
                                    },
                                    maxTicksLimit: 7,
                                    maxRotation: 0
                                }
                            },
                            y: {
                                beginAtZero: true,
                                ticks: {
                                    color: "#64748b",
                                    font: {
                                        size: 9
                                    },
                                    callback: function(value) {
                                        return formatMs(value);
                                    }
                                },
                                grid: {
                                    color: "#edf0f4"
                                }
                            }
                        }
                    }
                }
            );
        }

        if (uptimeCanvas) {
            const uptimeWrapper = uptimeCanvas.parentElement;
            const nativeStatus = uptimeWrapper
                ? uptimeWrapper.querySelector(".native-analytics-chart")
                : null;

            if (nativeStatus) {
                nativeStatus.remove();
            }

            uptimeCanvas.style.display = "";

            uptimeChart = new Chart(
                uptimeCanvas,
                {
                    type: "line",
                    data: {
                        labels: labels.length
                            ? labels
                            : ["No data"],
                        datasets: [
                            {
                                label: "UP · Healthy",
                                data: upValues.length
                                    ? upValues
                                    : [null],
                                borderColor: "#10b981",
                                backgroundColor: "rgba(16,185,129,0.08)",
                                fill: false,
                                stepped: true,
                                tension: 0,
                                spanGaps: false,
                                pointRadius: 2.5,
                                pointHoverRadius: 5,
                                pointBackgroundColor: "#10b981",
                                pointBorderColor: "#ffffff",
                                pointBorderWidth: 1.5,
                                borderWidth: 3
                            },
                            {
                                label: "SLOW · Degraded",
                                data: slowValues.length
                                    ? slowValues
                                    : [null],
                                borderColor: "#f59e0b",
                                backgroundColor: "rgba(245,158,11,0.08)",
                                fill: false,
                                stepped: true,
                                tension: 0,
                                spanGaps: false,
                                pointRadius: 2.5,
                                pointHoverRadius: 5,
                                pointBackgroundColor: "#f59e0b",
                                pointBorderColor: "#ffffff",
                                pointBorderWidth: 1.5,
                                borderWidth: 3
                            },
                            {
                                label: "DOWN · Failed",
                                data: downValues.length
                                    ? downValues
                                    : [null],
                                borderColor: "#ef4444",
                                backgroundColor: "rgba(239,68,68,0.08)",
                                fill: false,
                                stepped: true,
                                tension: 0,
                                spanGaps: false,
                                pointRadius: 2.5,
                                pointHoverRadius: 5,
                                pointBackgroundColor: "#ef4444",
                                pointBorderColor: "#ffffff",
                                pointBorderWidth: 1.5,
                                borderWidth: 3
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: {
                            intersect: false,
                            mode: "index"
                        },
                        plugins: {
                            legend: {
                                display: false
                            },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        if (context.dataset.label) {
                                            return " " + context.dataset.label;
                                        }
                                        return " No data";
                                    }
                                }
                            }
                        },
                        scales: {
                            x: {
                                grid: {
                                    color: "rgba(148,163,184,0.07)"
                                },
                                ticks: {
                                    color: "#94a3b8",
                                    font: {
                                        size: 9
                                    },
                                    maxTicksLimit: 7,
                                    maxRotation: 0
                                }
                            },
                            y: {
                                min: 0.5,
                                max: 3.5,
                                ticks: {
                                    color: "#64748b",
                                    font: {
                                        size: 9
                                    },
                                    stepSize: 1,
                                    callback: function(value) {
                                        if (value === 3) return "UP";
                                        if (value === 2) return "SLOW";
                                        if (value === 1) return "DOWN";
                                        return "";
                                    }
                                },
                                grid: {
                                    color: "#edf0f4"
                                }
                            }
                        }
                    }
                }
            );
        }
    }

    function drawNativeLatencyChart(canvas, labels, values) {
        if (!canvas) {
            return;
        }

        const wrapper = canvas.parentElement;
        if (!wrapper) {
            return;
        }

        canvas.style.display = "none";

        const old = wrapper.querySelector(".native-analytics-chart");
        if (old) {
            old.remove();
        }

        const width = Math.max(wrapper.clientWidth || 600, 320);
        const height = Math.max(wrapper.clientHeight || 330, 220);
        const pad = { left: 48, right: 16, top: 16, bottom: 34 };

        const valid = values
            .map((value, index) => ({ value, index }))
            .filter(point => point.value !== null);

        const maxValue = valid.length
            ? Math.max(...valid.map(point => point.value), 1)
            : 1;

        const x = index =>
            pad.left +
            (index / Math.max(values.length - 1, 1)) *
            (width - pad.left - pad.right);

        const y = value =>
            height -
            pad.bottom -
            (value / maxValue) *
            (height - pad.top - pad.bottom);

        const points = valid
            .map(point => `${x(point.index)},${y(point.value)}`)
            .join(" ");

        const grid = [0, 0.25, 0.5, 0.75, 1].map(ratio => {
            const gy = height - pad.bottom -
                ratio * (height - pad.top - pad.bottom);
            const value = maxValue * ratio;

            return `
                <line x1="${pad.left}" y1="${gy}"
                      x2="${width - pad.right}" y2="${gy}"
                      stroke="#edf0f4" stroke-width="1"/>
                <text x="${pad.left - 8}" y="${gy + 3}"
                      text-anchor="end"
                      font-size="9" fill="#64748b">
                    ${escapeHTML(formatMs(value))}
                </text>
            `;
        }).join("");

        const svg = `
            <svg class="native-analytics-chart"
                 viewBox="0 0 ${width} ${height}"
                 width="100%" height="100%"
                 role="img"
                 aria-label="Response time chart">
                ${grid}
                ${
                    points
                        ? `<polyline points="${points}"
                              fill="none"
                              stroke="#7467ff"
                              stroke-width="3"
                              stroke-linejoin="round"
                              stroke-linecap="round"/>`
                        : `<text x="${width / 2}" y="${height / 2}"
                                text-anchor="middle"
                                font-size="11"
                                fill="#64748b">No response-time data</text>`
                }
                ${valid.map(point => `
                    <circle cx="${x(point.index)}"
                            cy="${y(point.value)}"
                            r="3"
                            fill="#7467ff"/>
                `).join("")}
            </svg>
        `;

        wrapper.insertAdjacentHTML("beforeend", svg);
    }

    function drawNativeStatusChart(canvas, labels, states) {
        if (!canvas) {
            return;
        }

        const wrapper = canvas.parentElement;
        if (!wrapper) {
            return;
        }

        canvas.style.display = "none";

        const old = wrapper.querySelector(".native-analytics-chart");
        if (old) {
            old.remove();
        }

        const width = Math.max(wrapper.clientWidth || 600, 320);
        const height = Math.max(wrapper.clientHeight || 235, 220);
        const pad = { left: 54, right: 16, top: 18, bottom: 30 };

        const x = index =>
            pad.left +
            (index / Math.max(states.length - 1, 1)) *
            (width - pad.left - pad.right);

        const y = state => {
            if (state === "up") return pad.top + 18;
            if (state === "slow") return height / 2;
            if (state === "down") return height - pad.bottom - 18;
            return null;
        };

        const grid = [
            ["UP", pad.top + 18],
            ["SLOW", height / 2],
            ["DOWN", height - pad.bottom - 18]
        ].map(([label, gy]) => `
            <line x1="${pad.left}" y1="${gy}"
                  x2="${width - pad.right}" y2="${gy}"
                  stroke="#edf0f4" stroke-width="1"/>
            <text x="${pad.left - 9}" y="${gy + 3}"
                  text-anchor="end"
                  font-size="9" fill="#64748b">${label}</text>
        `).join("");

        const statusColor = {
            up: "#10b981",
            slow: "#f59e0b",
            down: "#ef4444"
        };

        const segments = [];

        for (let i = 1; i < states.length; i++) {
            const previous = states[i - 1];
            const current = states[i];

            if (!statusColor[previous] || !statusColor[current]) {
                continue;
            }

            const x1 = x(i - 1);
            const y1 = y(previous);
            const x2 = x(i);
            const y2 = y(current);

            segments.push(`
                <line x1="${x1}" y1="${y1}"
                      x2="${x2}" y2="${y2}"
                      stroke="${statusColor[current]}"
                      stroke-width="3"
                      stroke-linecap="round"/>
            `);
        }

        const points = states.map((state, index) => {
            if (!statusColor[state]) {
                return "";
            }

            return `
                <circle cx="${x(index)}"
                        cy="${y(state)}"
                        r="3.5"
                        fill="${statusColor[state]}"/>
            `;
        }).join("");

        const svg = `
            <svg class="native-analytics-chart"
                 viewBox="0 0 ${width} ${height}"
                 width="100%" height="100%"
                 role="img"
                 aria-label="API health status chart">
                ${grid}
                ${segments.join("")}
                ${points}
                ${
                    states.some(state => statusColor[state])
                        ? ""
                        : `<text x="${width / 2}" y="${height / 2}"
                                text-anchor="middle"
                                font-size="11"
                                fill="#64748b">No status data</text>`
                }
            </svg>
        `;

        wrapper.insertAdjacentHTML("beforeend", svg);
    }


    function statusForBucket(item, threshold) {
        const downChecks = Number(
            item?.down_checks ??
            item?.down ??
            0
        );

        const rawStatus = String(
            item?.status ??
            item?.state ??
            ""
        ).toUpperCase();

        if (
            downChecks > 0 ||
            rawStatus === "DOWN" ||
            rawStatus === "FAILED" ||
            rawStatus === "FAIL"
        ) {
            return "down";
        }

        const latency = getHistoryLatency(item);
        const thresholdValue = numberOrNull(threshold);

        if (
            latency !== null &&
            thresholdValue !== null &&
            latency > thresholdValue
        ) {
            return "slow";
        }

        const checks = Number(
            item?.checks ??
            item?.total_checks ??
            0
        );

        if (
            checks > 0 ||
            rawStatus === "UP" ||
            rawStatus === "HEALTHY"
        ) {
            return "up";
        }

        return "empty";
    }

    function statusChartOptions() {
        return {
            responsive: true,
            maintainAspectRatio: false,
            interaction: {
                intersect: false,
                mode: "index"
            },
            plugins: {
                legend: {
                    display: false
                },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            const value = context.parsed.y;

                            if (value === null || value === undefined) {
                                return " No data";
                            }

                            return " " + value + " bucket";
                        }
                    }
                }
            },
            scales: {
                x: {
                    grid: {
                        color: "rgba(148,163,184,0.07)"
                    },
                    ticks: {
                        color: "#64748b",
                        font: {
                            size: 9
                        },
                        maxTicksLimit: 6,
                        maxRotation: 0
                    }
                },
                y: {
                    beginAtZero: true,
                    suggestedMax: 1.2,
                    ticks: {
                        color: "#64748b",
                        font: {
                            size: 9
                        },
                        stepSize: 1,
                        callback: function(value) {
                            return value === 1 ? "Status" : "";
                        }
                    },
                    grid: {
                        color: "rgba(148,163,184,0.08)"
                    }
                }
            }
        };
    }

    function chartOptions(unit, maxY = null) {
        return {
            responsive: true,
            maintainAspectRatio: false,

            interaction: {
                intersect: false,
                mode: "index"
            },

            plugins: {
                legend: {
                    display: false
                },

                tooltip: {
                    callbacks: {
                        label: function(context) {
                            const value = context.parsed.y;

                            if (value === null || value === undefined) {
                                return " No data";
                            }

                            return " "
                                + (unit === "%"
                                    ? Number(value).toFixed(1) + "%"
                                    : formatMs(value));
                        }
                    }
                }
            },

            scales: {
                x: {
                    grid: {
                        color: "rgba(148,163,184,0.07)"
                    },

                    ticks: {
                        color: "#64748b",
                        font: {
                            size: 9
                        },
                        maxTicksLimit: 8,
                        maxRotation: 0
                    }
                },

                y: {
                    beginAtZero: true,
                    suggestedMax: maxY,

                    grid: {
                        color: "rgba(148,163,184,0.08)"
                    },

                    ticks: {
                        color: "#64748b",
                        font: {
                            size: 9
                        },

                        callback: function(value) {
                            return unit === "%"
                                ? value + "%"
                                : formatMs(value);
                        }
                    }
                }
            }
        };
    }

    function renderChecks(checks) {
        const body = document.getElementById("checksBody");

        if (!body) {
            return;
        }

        if (!checks.length) {
            body.innerHTML = `
                <tr>
                    <td colspan="5">
                        <div class="empty">
                            No monitoring checks in the selected period.
                        </div>
                    </td>
                </tr>
            `;
            return;
        }

        body.innerHTML = checks.map(check => {
            const isUp = String(check.status || "").toUpperCase() === "UP";

            const badge = isUp
                ? `<span class="badge up">● UP</span>`
                : `<span class="badge down">● DOWN</span>`;

            return `
                <tr>
                    <td>${escapeHTML(formatDateTime(check.checked_at ?? check.timestamp ?? check.time))}</td>
                    <td>${badge}</td>
                    <td>${formatMs(check.response_time_ms)}</td>
                    <td>${check.status_code ?? "—"}</td>
                    <td>${escapeHTML(check.error_message || "—")}</td>
                </tr>
            `;
        }).join("");
    }

    function numberOrNull(value) {
        if (
            value === null ||
            value === undefined ||
            value === ""
        ) {
            return null;
        }

        const number = Number(value);

        return Number.isFinite(number)
            ? number
            : null;
    }

    function formatNumber(value) {
        const number = numberOrNull(value);

        if (number === null) {
            return "—";
        }

        return new Intl.NumberFormat("en-IN").format(
            Math.round(number)
        );
    }

    function formatMs(value) {
        const number = numberOrNull(value);

        if (number === null) {
            return "—";
        }

        if (number >= 1000) {
            return (number / 1000).toFixed(2) + " s";
        }

        return Math.round(number).toLocaleString("en-IN") + " ms";
    }

    function formatPercent(value) {
        const number = numberOrNull(value);

        if (number === null) {
            return "—";
        }

        return number.toFixed(2).replace(/\.00$/, "") + "%";
    }

    function formatDateTime(value) {
        if (!value) {
            return "—";
        }

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
            return String(value);
        }

        return date.toLocaleString([], {
            dateStyle: "short",
            timeStyle: "short"
        });
    }

    function formatChartLabel(value) {
        if (!value) {
            return "";
        }

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
            return String(value);
        }

        return date.toLocaleString([], {
            month: "short",
            day: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        });
    }

    function escapeHTML(value) {
        const div = document.createElement("div");
        div.textContent = value ?? "";
        return div.innerHTML;
    }

    function escapeAttribute(value) {
        return escapeHTML(String(value))
            .replace(/"/g, "&quot;");
    }

    initialLoad();

    refreshTimer = setInterval(
        () => loadSelectedAnalytics(false),
        30000
    );
</script>
