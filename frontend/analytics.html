<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - API Monitor</title>
    <meta name="description" content="API monitoring analytics dashboard">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --bg: #f6f8fc;
            --card: #ffffff;
            --text: #172033;
            --muted: #718096;
            --border: #e6eaf0;
            --green: #059669;
            --green-bg: #ecfdf5;
            --red: #dc2626;
            --red-bg: #fef2f2;
            --amber: #d97706;
            --amber-bg: #fffbeb;
            --shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at 85% 5%, rgba(129, 140, 248, 0.13), transparent 28%),
                radial-gradient(circle at 5% 90%, rgba(96, 165, 250, 0.08), transparent 25%),
                var(--bg);
            color: var(--text);
            font-family: "Segoe UI", Arial, sans-serif;
        }

        button,
        select {
            font: inherit;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 248px;
            flex: 0 0 248px;
            flex-shrink: 0;
            min-height: 100vh;
            position: sticky;
            top: 0;
            height: 100vh;
            background: rgba(255, 255, 255, 0.92);
            border-right: 1px solid var(--border);
            padding: 26px 18px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 6px 28px;
        }

        .brand-logo {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            font-weight: 800;
            font-size: 18px;
            box-shadow: 0 7px 18px rgba(99, 102, 241, 0.25);
        }

        .brand-title {
            font-size: 15px;
            font-weight: 900;
        }

        .brand-subtitle {
            margin-top: 2px;
            color: #718096;
            font-size: 8px;
        }

        .menu-label {
            padding: 0 8px 10px;
            color: #94a3b8;
            font-size: 9px;
            font-weight: 800;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        .nav {
            display: grid;
            gap: 4px;
        }

        .nav a {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 11px 10px;
            border-radius: 9px;
            color: #64748b;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
        }

        .nav a:hover,
        .nav a.active {
            background: #eef2ff;
            color: var(--primary-dark);
        }

        .main {
            flex: 1;
            min-width: 0;
            padding: 34px 36px 60px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 22px;
        }

        .eyebrow {
            margin-bottom: 5px;
            color: var(--primary);
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }

        h1 {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 34px;
            line-height: 1.05;
            color: #172033;
            letter-spacing: -0.03em;
        }

        .subtitle {
            margin: 7px 0 0;
            color: var(--muted);
            font-size: 13px;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .btn {
            min-height: 40px;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 11px 15px;
            background: white;
            color: #475569;
            cursor: pointer;
            font-size: 12px;
            font-weight: 800;
        }

        .btn:hover {
            background: #f8fafc;
        }

        .btn-primary {
            border-color: transparent;
            background: linear-gradient(135deg, #6366f1, #7c3aed);
            color: white;
            box-shadow: 0 7px 18px rgba(99, 102, 241, 0.18);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #4f46e5, #6d28d9);
        }

        .metrics {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 14px;
            margin-bottom: 16px;
        }

        .metric {
            position: relative;
            overflow: hidden;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
            box-shadow: var(--shadow);
        }

        .metric::after {
            content: "";
            position: absolute;
            right: -24px;
            bottom: -28px;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(99, 102, 241, 0.05);
        }

        .metric-label {
            color: #64748b;
            font-size: 12px;
            font-weight: 800;
        }

        .metric-value {
            margin-top: 10px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -0.03em;
        }

        .metric-help {
            margin-top: 5px;
            color: #94a3b8;
            font-size: 12px;
        }

        .grid {
            display: grid;
            grid-template-columns: minmax(0, 1.35fr) minmax(0, 0.65fr);
            gap: 16px;
            margin-bottom: 16px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 15px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 16px 18px;
            border-bottom: 1px solid #edf0f4;
        }

        .card-title {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 15px;
            font-weight: 900;
        }

        .card-subtitle {
            margin: 4px 0 0;
            color: #94a3b8;
            font-size: 12px;
        }

        .card-body {
            padding: 20px;
        }

        .chart-wrap {
            height: 300px;
        }

        .mini-chart {
            height: 220px;
        }

        .period-select {
            position: relative;
            z-index: 5;
            height: 42px;
            min-width: 150px;
            border: 1px solid #dfe5ee;
            border-radius: 11px;
            background: #ffffff;
            color: #475569;
            padding: 0 12px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            outline: none;
        }

        .period-select:hover {
            border-color: #c7d2fe;
        }

        .period-select:focus,
        .period-select:active {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.10);
        }

        .status-panel {
            display: grid;
            place-items: center;
            min-height: 220px;
            text-align: center;
        }

        .status-circle {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: var(--green-bg);
            border: 8px solid #d1fae5;
            color: var(--green);
            font-size: 19px;
            font-weight: 900;
        }

        .status-circle.down {
            background: var(--red-bg);
            border-color: #fee2e2;
            color: var(--red);
        }

        .status-title {
            margin-top: 13px;
            font-size: 15px;
            font-weight: 900;
        }

        .status-detail {
            margin-top: 4px;
            color: var(--muted);
            font-size: 12px;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 620px;
        }

        th,
        td {
            padding: 12px 18px;
            border-bottom: 1px solid #edf0f4;
            text-align: left;
            font-size: 12px;
        }

        th {
            color: #94a3b8;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        td {
            color: #475569;
            font-weight: 600;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 8px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 900;
        }

        .badge.up {
            color: var(--green);
            background: var(--green-bg);
        }

        .badge.down {
            color: var(--red);
            background: var(--red-bg);
        }

        .badge.unknown {
            color: var(--amber);
            background: var(--amber-bg);
        }

        .loading {
            min-height: 330px;
            display: grid;
            place-items: center;
            color: var(--muted);
            font-size: 13px;
        }

        .loader {
            width: 28px;
            height: 28px;
            border: 3px solid #e2e8f0;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .error {
            padding: 30px;
            text-align: center;
            color: var(--red);
            font-size: 13px;
        }

        .error strong {
            display: block;
            color: #991b1b;
            margin-bottom: 6px;
        }

        .empty {
            padding: 34px 36px 60px;
            text-align: center;
            color: var(--muted);
            font-size: 11px;
        }

        @media (max-width: 1100px) {
            .sidebar {
                width: 220px;
                flex-basis: 220px;
            }

            .metrics {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 720px) {
            .layout {
                display: block;
            }

            .sidebar {
                width: 100%;
                flex-basis: auto;
                border-right: 0;
                border-bottom: 1px solid var(--border);
                padding: 12px;
            }

            .brand {
                padding-bottom: 12px;
            }

            .menu-label {
                display: none;
            }

            .nav {
                grid-template-columns: repeat(4, 1fr);
            }

            .nav a {
                justify-content: center;
                font-size: 10px;
            }

            .main {
                padding: 20px;
            }

            .topbar {
                flex-direction: column;
            }

            .top-actions {
                width: 100%;
            }

            .top-actions .btn {
                flex: 1;
            }

            .metrics {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 480px) {
            .metrics {
                grid-template-columns: 1fr;
            }

            .nav {
                grid-template-columns: repeat(4, 1fr);
            }

            .nav a {
                padding: 8px 3px;
            }

            .nav a span {
                display: none;
            }
        }
    </style>
</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <div class="brand">
            <div class="brand-logo">A</div>
            <div>
                <div class="brand-title">API Monitor</div>
                <div class="brand-subtitle">Monitoring Platform</div>
            </div>
        </div>

        <div class="menu-label">MENU</div>

        <nav class="nav">
            <a href="/app/dashboard.html">▣ <span>Dashboard</span></a>
            <a href="/app/analytics.html" class="active">◈ <span>Analytics</span></a>
            <a href="/app/incidents.html">! <span>Incidents</span></a>
            <a href="/app/settings.html">⚙ <span>Settings</span></a>
        </nav>

    </aside>

    <main class="main">

        <header class="topbar">

            <div>
                <div class="eyebrow">Monitoring analytics</div>
                <h1 id="pageTitle">API Analytics</h1>
                <p class="subtitle" id="pageSubtitle">
                    Performance and uptime insights for your monitored API.
                </p>
            </div>

            <div class="top-actions">
                <button class="btn" onclick="goBack()">← Dashboard</button>
                <button class="btn btn-primary" id="refreshBtn" onclick="loadAnalytics()">
                    ↻ Refresh
                </button>
            </div>

        </header>

        <section id="content">

            <div class="loading">
                <div>
                    <div class="loader"></div>
                    Loading analytics...
                </div>
            </div>

        </section>

    </main>

</div>

<script>
    const token = localStorage.getItem("access_token");

    if (!token) {
        window.location.href = "/app/user_login.html";
    }

    const params = new URLSearchParams(window.location.search);
    let monitorId = params.get("monitor_id");

    function getPeriod() {
        const value = new URLSearchParams(window.location.search).get("period");
        return ["24h", "7d", "30d"].includes(value) ? value : "7d";
    }

    function setPeriod(value) {
        const url = new URL(window.location.href);
        url.searchParams.set("period", value);
        if (monitorId) {
            url.searchParams.set("monitor_id", monitorId);
        }
        window.history.replaceState({}, "", url);
    }

    let latencyChart = null;
    let uptimeChart = null;

    function goBack() {
        window.location.href = "/app/dashboard.html";
    }

    function authHeaders() {
        return {
            "Authorization": "Bearer " + token,
            "Accept": "application/json"
        };
    }

    async function loadAnalytics() {

        const content = document.getElementById("content");
        const refreshBtn = document.getElementById("refreshBtn");

        refreshBtn.textContent = "↻ Loading...";
        refreshBtn.disabled = true;

        content.innerHTML = `
            <div class="loading">
                <div>
                    <div class="loader"></div>
                    Loading analytics...
                </div>
            </div>
        `;

        try {

            const period = getPeriod();
            let data;

            // If Analytics is opened directly without ?monitor_id=...,
            // the global endpoint returns a monitor list. Select the first
            // available monitor and then request its full analytics data.
            if (!monitorId) {
                const listResponse = await fetch(
                    `/api/monitoring/analytics/?period=${encodeURIComponent(period)}`,
                    {
                        method: "GET",
                        headers: authHeaders()
                    }
                );

                if (listResponse.status === 401 || listResponse.status === 403) {
                    localStorage.removeItem("access_token");
                    localStorage.removeItem("refresh_token");
                    window.location.href = "/app/user_login.html";
                    return;
                }

                if (!listResponse.ok) {
                    throw new Error(
                        "Analytics monitor list returned HTTP " + listResponse.status
                    );
                }

                const payload = await listResponse.json();
                const monitors = extractMonitorList(payload);

                if (!monitors.length) {
                    throw new Error("No monitored APIs are available.");
                }

                const firstMonitor = monitors[0];
                const discoveredId = firstValue(
                    firstMonitor.monitor_id,
                    firstMonitor.id,
                    firstMonitor.monitorId,
                    firstMonitor.pk
                );

                if (discoveredId === null || discoveredId === undefined || discoveredId === "") {
                    throw new Error("The analytics response did not contain a monitor ID.");
                }

                monitorId = String(discoveredId);

                const url = new URL(window.location.href);
                url.searchParams.set("monitor_id", monitorId);
                url.searchParams.set("period", period);
                window.history.replaceState({}, "", url);
            }

            const endpoint =
                `/api/monitoring/analytics/${encodeURIComponent(monitorId)}/?period=${encodeURIComponent(period)}`;

            const response = await fetch(
                endpoint,
                {
                    method: "GET",
                    headers: authHeaders()
                }
            );

            if (response.status === 401 || response.status === 403) {
                localStorage.removeItem("access_token");
                localStorage.removeItem("refresh_token");
                window.location.href = "/app/user_login.html";
                return;
            }

            if (!response.ok) {
                throw new Error(
                    "Analytics request returned HTTP " + response.status
                );
            }

            data = await response.json();

            renderAnalytics(data);

        } catch (error) {

            console.error("Analytics error:", error);

            content.innerHTML = `
                <div class="card">
                    <div class="error">
                        <strong>Unable to load analytics</strong>
                        <div>
                            The analytics endpoint could not be loaded.
                        </div>
                        <div style="margin-top:8px;font-size:10px;color:#94a3b8;">
                            ${escapeHTML(error.message)}
                        </div>
                    </div>
                </div>
            `;

        } finally {

            refreshBtn.textContent = "↻ Refresh";
            refreshBtn.disabled = false;

        }

    }

    function changePeriod(value) {
        setPeriod(value);
        loadAnalytics();
    }

    function syncPeriodSelect() {
        const select = document.getElementById("periodSelect");
        if (select) {
            select.value = getPeriod();
        }
    }

    function renderAnalytics(data) {

        const normalized = normalizeAnalytics(data);

        document.getElementById("pageTitle").textContent =
            normalized.name
                ? normalized.name + " Analytics"
                : "API Analytics";

        document.getElementById("pageSubtitle").textContent =
            normalized.url
                ? normalized.url
                : "Performance and uptime insights for your monitored API.";

        document.getElementById("content").innerHTML = `

            <section class="metrics">

                <div class="metric">
                    <div class="metric-label">Uptime</div>
                    <div class="metric-value">${formatPercent(normalized.uptime)}</div>
                    <div class="metric-help">Overall availability</div>
                </div>

                <div class="metric">
                    <div class="metric-label">Average Response</div>
                    <div class="metric-value">${formatMs(normalized.avgLatency)}</div>
                    <div class="metric-help">Average API latency</div>
                </div>

                <div class="metric">
                    <div class="metric-label">P95 Latency</div>
                    <div class="metric-value">${formatMs(normalized.p95)}</div>
                    <div class="metric-help">95th percentile response time</div>
                </div>

                <div class="metric">
                    <div class="metric-label">Total Checks</div>
                    <div class="metric-value">${formatNumber(normalized.totalChecks)}</div>
                    <div class="metric-help">Monitoring checks recorded</div>
                </div>

            </section>

            <section class="grid">

                <div class="card">

                    <div class="card-header">

                        <div>
                            <h2 class="card-title">Response Time</h2>
                            <p class="card-subtitle">
                                API latency across recorded checks
                            </p>
                        </div>

                        <select
                            id="periodSelect"
                            class="period-select"
                            onchange="changePeriod(this.value)"
                        >
                            <option value="24h">Last 24 hours</option>
                            <option value="7d">Last 7 days</option>
                            <option value="30d">Last 30 days</option>
                        </select>

                    </div>

                    <div class="card-body">
                        <div class="chart-wrap">
                            <canvas id="latencyChart"></canvas>
                        </div>
                    </div>

                </div>

                <div class="card">

                    <div class="card-header">

                        <div>
                            <h2 class="card-title">Availability</h2>
                            <p class="card-subtitle">
                                Current monitoring status
                            </p>
                        </div>

                    </div>

                    <div class="card-body">

                        <div class="status-panel">

                            <div>

                                <div
                                    id="statusCircle"
                                    class="status-circle ${normalized.down ? "down" : ""}"
                                >
                                    ${normalized.down ? "DOWN" : "UP"}
                                </div>

                                <div class="status-title">
                                    ${normalized.down ? "API needs attention" : "API is healthy"}
                                </div>

                                <div class="status-detail">
                                    ${formatPercent(normalized.uptime)} uptime
                                    ${normalized.failedChecks !== null
                                        ? " • " + formatNumber(normalized.failedChecks) + " failed checks"
                                        : ""}
                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </section>

            <section class="grid">

                <div class="card">

                    <div class="card-header">

                        <div>
                            <h2 class="card-title">Uptime History</h2>
                            <p class="card-subtitle">
                                Availability trend from recorded monitoring data
                            </p>
                        </div>

                    </div>

                    <div class="card-body">
                        <div class="mini-chart">
                            <canvas id="uptimeChart"></canvas>
                        </div>
                    </div>

                </div>

                <div class="card">

                    <div class="card-header">

                        <div>
                            <h2 class="card-title">Check Summary</h2>
                            <p class="card-subtitle">
                                Monitoring result breakdown
                            </p>
                        </div>

                    </div>

                    <div class="card-body">

                        <div style="display:grid;gap:12px;">

                            <div style="display:flex;justify-content:space-between;">
                                <span style="font-size:10px;color:#64748b;">Successful checks</span>
                                <strong style="font-size:11px;">
                                    ${formatNumber(normalized.successfulChecks)}
                                </strong>
                            </div>

                            <div style="display:flex;justify-content:space-between;">
                                <span style="font-size:10px;color:#64748b;">Failed checks</span>
                                <strong style="font-size:11px;color:#dc2626;">
                                    ${formatNumber(normalized.failedChecks)}
                                </strong>
                            </div>

                            <div style="height:1px;background:#edf0f4;"></div>

                            <div style="display:flex;justify-content:space-between;">
                                <span style="font-size:10px;color:#64748b;">Current status</span>
                                <span class="badge ${normalized.down ? "down" : "up"}">
                                    ${normalized.down ? "● DOWN" : "● UP"}
                                </span>
                            </div>

                        </div>

                    </div>

                </div>

            </section>

            <section class="card">

                <div class="card-header">

                    <div>
                        <h2 class="card-title">Recent Monitoring Checks</h2>
                        <p class="card-subtitle">
                            Latest response and status measurements
                        </p>
                    </div>

                </div>

                <div class="table-wrap">

                    <table>

                        <thead>
                            <tr>
                                <th>Time</th>
                                <th>Status</th>
                                <th>Response</th>
                                <th>HTTP Status</th>
                                <th>Message</th>
                            </tr>
                        </thead>

                        <tbody id="checksBody"></tbody>

                    </table>

                </div>

            </section>
        `;

        drawCharts(normalized);
        renderChecks(normalized.checks);

    }

    function extractMonitorList(payload) {
        if (Array.isArray(payload)) return payload;
        if (!payload || typeof payload !== "object") return [];

        const candidates = [payload.results, payload.monitors, payload.data, payload.analytics, payload.items];
        for (const candidate of candidates) {
            if (Array.isArray(candidate)) return candidate;
        }

        if (payload.monitor_id !== undefined || payload.id !== undefined || payload.monitorId !== undefined || payload.pk !== undefined) {
            return [payload];
        }
        return [];
    }

    function normalizeAnalytics(data) {

        const root = data && typeof data === "object"
            ? data
            : {};

        const source =
            root.data ||
            root.analytics ||
            root.result ||
            root;

        const stats =
            source.stats ||
            source.metrics ||
            source.summary ||
            source;

        const history =
            source.history ||
            source.data_points ||
            source.datapoints ||
            source.timeline ||
            source.series ||
            root.history ||
            [];

        const checks =
            source.checks ||
            source.logs ||
            source.results ||
            root.checks ||
            root.logs ||
            [];

        const uptime = firstValue(
            stats.uptime_percentage,
            stats.uptime,
            stats.availability,
            source.uptime_percentage,
            source.uptime,
            source.availability
        );

        const avgLatency = firstValue(
            stats.average_response_time,
            stats.avg_response_time,
            stats.average_latency,
            stats.avg_latency,
            stats.response_time_avg,
            source.average_response_time,
            source.avg_latency
        );

        const p95 = firstValue(
            stats.p95_latency,
            stats.p95,
            stats.p95_response_time,
            source.p95_latency,
            source.p95
        );

        const totalChecks = firstValue(
            stats.total_checks,
            stats.total_requests,
            stats.total,
            source.total_checks,
            source.total
        );

        const successfulChecks = firstValue(
            stats.successful_checks,
            stats.successful,
            stats.success_count,
            source.successful_checks
        );

        const failedChecks = firstValue(
            stats.failed_checks,
            stats.failed,
            stats.failure_count,
            stats.error_count,
            source.failed_checks
        );

        const status = String(
            firstValue(
                source.status,
                source.monitor_status,
                source.current_status,
                ""
            ) || ""
        ).toLowerCase();

        const down =
            status.includes("down") ||
            status.includes("fail") ||
            status.includes("offline") ||
            status.includes("unhealthy");

        return {
            name: firstValue(
                source.name,
                source.monitor_name,
                source.api_name
            ),

            url: firstValue(
                source.url,
                source.api_url
            ),

            uptime: uptime,
            avgLatency: avgLatency,
            p95: p95,
            totalChecks: totalChecks,
            successfulChecks: successfulChecks,
            failedChecks: failedChecks,
            down: down,
            history: normalizeHistory(history),
            checks: normalizeChecks(checks)
        };

    }

    function normalizeHistory(history) {

        if (!Array.isArray(history)) {
            return [];
        }

        return history.map((item, index) => {

            if (typeof item === "number") {
                return {
                    label: String(index + 1),
                    latency: item,
                    uptime: null
                };
            }

            const obj = item || {};

            return {
                label: firstValue(
                    obj.timestamp,
                    obj.time,
                    obj.date,
                    obj.label,
                    String(index + 1)
                ),

                latency: firstValue(
                    obj.response_time,
                    obj.responseTime,
                    obj.latency,
                    obj.response_ms,
                    obj.value
                ),

                uptime: firstValue(
                    obj.uptime_percentage,
                    obj.uptime,
                    obj.availability
                )
            };

        });

    }

    function normalizeChecks(checks) {

        if (!Array.isArray(checks)) {
            return [];
        }

        return checks.slice(0, 15).map(item => {

            const obj = item || {};

            const status = String(
                firstValue(
                    obj.status,
                    obj.result,
                    obj.state,
                    ""
                ) || ""
            ).toLowerCase();

            let type = "unknown";

            if (
                status.includes("up") ||
                status.includes("success") ||
                status.includes("healthy") ||
                status.includes("200")
            ) {
                type = "up";
            }

            if (
                status.includes("down") ||
                status.includes("fail") ||
                status.includes("error") ||
                status.includes("offline")
            ) {
                type = "down";
            }

            return {
                time: firstValue(
                    obj.timestamp,
                    obj.created_at,
                    obj.checked_at,
                    obj.time,
                    obj.date,
                    "—"
                ),

                type: type,

                response: firstValue(
                    obj.response_time,
                    obj.responseTime,
                    obj.latency,
                    obj.response_ms
                ),

                httpStatus: firstValue(
                    obj.status_code,
                    obj.http_status,
                    obj.response_status,
                    obj.code
                ),

                message: firstValue(
                    obj.message,
                    obj.error,
                    obj.detail,
                    obj.status,
                    "—"
                )
            };

        });

    }

    function drawCharts(data) {

        if (typeof Chart === "undefined") {
            return;
        }

        const labels = data.history.map(item =>
            formatChartLabel(item.label)
        );

        const latencyValues = data.history.map(item =>
            numericValue(item.latency)
        );

        const uptimeValues = data.history.map(item =>
            numericValue(item.uptime)
        );

        const validLatency =
            latencyValues.some(value => value !== null);

        const validUptime =
            uptimeValues.some(value => value !== null);

        if (latencyChart) {
            latencyChart.destroy();
        }

        if (uptimeChart) {
            uptimeChart.destroy();
        }

        const latencyCanvas =
            document.getElementById("latencyChart");

        const uptimeCanvas =
            document.getElementById("uptimeChart");

        if (latencyCanvas) {

            latencyChart = new Chart(
                latencyCanvas,
                {
                    type: "line",

                    data: {
                        labels: labels.length
                            ? labels
                            : ["No history"],

                        datasets: [
                            {
                                label: "Response time (ms)",

                                data: validLatency
                                    ? latencyValues
                                    : [0],

                                borderColor: "#6366f1",
                                backgroundColor: "rgba(99,102,241,0.08)",
                                fill: true,
                                tension: 0.35,
                                pointRadius: 2,
                                pointHoverRadius: 5
                            }
                        ]
                    },

                    options: chartOptions(
                        "ms"
                    )
                }
            );

        }

        if (uptimeCanvas) {

            uptimeChart = new Chart(
                uptimeCanvas,
                {
                    type: "line",

                    data: {
                        labels: labels.length
                            ? labels
                            : ["No history"],

                        datasets: [
                            {
                                label: "Uptime (%)",

                                data: validUptime
                                    ? uptimeValues
                                    : [
                                        numericValue(data.uptime) ?? 0
                                    ],

                                borderColor: "#059669",
                                backgroundColor: "rgba(5,150,105,0.08)",
                                fill: true,
                                tension: 0.35,
                                pointRadius: 2,
                                pointHoverRadius: 5
                            }
                        ]
                    },

                    options: chartOptions(
                        "%",
                        100
                    )
                }
            );

        }

    }

    function chartOptions(unit, maxY = null) {

        return {
            responsive: true,
            maintainAspectRatio: false,

            plugins: {
                legend: {
                    display: false
                },

                tooltip: {
                    callbacks: {
                        label: function(context) {
                            return (
                                " " +
                                context.parsed.y +
                                " " +
                                unit
                            );
                        }
                    }
                }
            },

            scales: {
                x: {
                    grid: {
                        display: false
                    },

                    ticks: {
                        color: "#94a3b8",
                        font: {
                            size: 9
                        },
                        maxTicksLimit: 7
                    }
                },

                y: {
                    beginAtZero: true,
                    ...(maxY !== null ? { max: maxY } : {}),

                    grid: {
                        color: "#edf0f4"
                    },

                    ticks: {
                        color: "#94a3b8",
                        font: {
                            size: 9
                        }
                    }
                }
            }
        };

    }

    function renderChecks(checks) {

        const body =
            document.getElementById("checksBody");

        if (!body) {
            return;
        }

        if (!checks.length) {

            body.innerHTML = `
                <tr>
                    <td colspan="5">
                        <div class="empty">
                            No monitoring check history was returned by the analytics endpoint.
                        </div>
                    </td>
                </tr>
            `;

            return;

        }

        body.innerHTML = checks.map(check => {

            const badge =
                check.type === "up"
                    ? `<span class="badge up">● UP</span>`
                    : check.type === "down"
                        ? `<span class="badge down">● DOWN</span>`
                        : `<span class="badge unknown">● UNKNOWN</span>`;

            return `
                <tr>

                    <td>
                        ${escapeHTML(formatDate(check.time))}
                    </td>

                    <td>
                        ${badge}
                    </td>

                    <td>
                        ${formatMs(check.response)}
                    </td>

                    <td>
                        ${escapeHTML(
                            check.httpStatus === null ||
                            check.httpStatus === undefined
                                ? "—"
                                : String(check.httpStatus)
                        )}
                    </td>

                    <td>
                        ${escapeHTML(String(check.message ?? "—"))}
                    </td>

                </tr>
            `;

        }).join("");

    }

    function firstValue(...values) {

        for (const value of values) {

            if (
                value !== null &&
                value !== undefined &&
                value !== ""
            ) {
                return value;
            }

        }

        return null;

    }

    function numericValue(value) {

        if (
            value === null ||
            value === undefined ||
            value === ""
        ) {
            return null;
        }

        const number = Number(value);

        return Number.isFinite(number)
            ? number
            : null;

    }

    function formatNumber(value) {

        const number = numericValue(value);

        if (number === null) {
            return "—";
        }

        return new Intl.NumberFormat().format(number);

    }

    function formatMs(value) {

        const number = numericValue(value);

        if (number === null) {
            return "—";
        }

        if (number >= 1000) {
            return (number / 1000).toFixed(2) + " s";
        }

        return Math.round(number) + " ms";

    }

    function formatPercent(value) {

        const number = numericValue(value);

        if (number === null) {
            return "—";
        }

        return number.toFixed(1).replace(".0", "") + "%";

    }

    function formatDate(value) {

        if (!value || value === "—") {
            return "—";
        }

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
            return String(value);
        }

        return date.toLocaleString(
            [],
            {
                dateStyle: "short",
                timeStyle: "short"
            }
        );

    }

    function formatChartLabel(value) {

        if (!value) {
            return "";
        }

        const date = new Date(value);

        if (!Number.isNaN(date.getTime())) {

            return date.toLocaleString(
                [],
                {
                    month: "short",
                    day: "numeric",
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );

        }

        return String(value);

    }

    function escapeHTML(value) {

        const div =
            document.createElement("div");

        div.textContent =
            value ?? "";

        return div.innerHTML;

    }

    loadAnalytics();
</script>

</body>
