<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>Analytics - API Monitor</title>
    <meta name="description" content="Live API monitoring analytics">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg: #f4f7fb;
            --panel: #ffffff;
            --panel-2: #f8fafc;
            --border: #dbe3ee;
            --text: #172033;
            --muted: #64748b;
            --primary: #7357ff;
            --primary-2: #8b5cf6;
            --green: #10b981;
            --red: #ef4444;
            --amber: #f59e0b;
            --blue: #38bdf8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at 85% 5%, rgba(115, 87, 255, 0.14), transparent 28%),
                radial-gradient(circle at 10% 90%, rgba(56, 189, 248, 0.07), transparent 24%),
                var(--bg);
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        button,
        select {
            font: inherit;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 178px;
            flex-shrink: 0;
            background: rgba(10, 19, 38, 0.96);
            border-right: 1px solid var(--border);
            padding: 20px 13px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 0 7px 26px;
        }

        .brand-logo {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            color: white;
            font-weight: 900;
            box-shadow: 0 7px 18px rgba(99, 102, 241, 0.25);
        }

        .brand-title {
            font-size: 13px;
            font-weight: 900;
        }

        .brand-subtitle {
            margin-top: 2px;
            color: #64748b;
            font-size: 8px;
        }

        .menu-label {
            padding: 0 8px 8px;
            color: #64748b;
            font-size: 8px;
            font-weight: 800;
            letter-spacing: 0.1em;
        }

        .nav {
            display: grid;
            gap: 4px;
        }

        .nav a {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 9px 10px;
            border-radius: 9px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 11px;
            font-weight: 700;
        }

        .nav a:hover,
        .nav a.active {
            background: rgba(115, 87, 255, 0.18);
            color: #c4b5fd;
        }

        .main {
            flex: 1;
            min-width: 0;
            padding: 28px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 20px;
        }

        .eyebrow {
            margin-bottom: 5px;
            color: #8b7cff;
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }

        h1 {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 29px;
            letter-spacing: -0.03em;
        }

        .subtitle {
            margin: 7px 0 0;
            color: var(--muted);
            font-size: 12px;
            word-break: break-all;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 9px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .control {
            height: 38px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--panel);
            color: #e2e8f0;
            padding: 0 12px;
            outline: none;
            font-size: 11px;
            font-weight: 800;
        }

        .control:focus {
            border-color: var(--primary);
        }

        .btn {
            height: 38px;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0 14px;
            background: var(--panel);
            color: #dbe4f0;
            cursor: pointer;
            font-size: 11px;
            font-weight: 800;
        }

        .btn:hover {
            border-color: #53678f;
        }

        .btn-primary {
            border-color: transparent;
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            color: white;
            box-shadow: 0 7px 18px rgba(99, 102, 241, 0.22);
        }

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: rgba(13, 22, 43, 0.88);
        }

        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .toolbar-label {
            color: var(--muted);
            font-size: 10px;
            font-weight: 800;
        }

        .live {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #86efac;
            font-size: 10px;
            font-weight: 800;
        }

        .live-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.10);
        }

        .metrics {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 14px;
            margin-bottom: 16px;
        }

        .metric {
            position: relative;
            overflow: hidden;
            min-height: 116px;
            background: rgba(13, 22, 43, 0.96);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px;
        }

        .metric::after {
            content: "";
            position: absolute;
            right: -24px;
            bottom: -28px;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(115, 87, 255, 0.07);
        }

        .metric-label {
            color: #a5b4c8;
            font-size: 10px;
            font-weight: 800;
        }

        .metric-value {
            margin-top: 10px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 25px;
            font-weight: 900;
            letter-spacing: -0.03em;
        }

        .metric-help {
            margin-top: 5px;
            color: #64748b;
            font-size: 9px;
        }

        .grid {
            display: grid;
            grid-template-columns: minmax(0, 1.35fr) minmax(290px, 0.65fr);
            gap: 16px;
            margin-bottom: 16px;
        }

        .card {
            background: rgba(13, 22, 43, 0.96);
            border: 1px solid var(--border);
            border-radius: 15px;
            overflow: hidden;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 16px 18px;
            border-bottom: 1px solid #1d2c4b;
        }

        .card-title {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 15px;
            font-weight: 900;
        }

        .card-subtitle {
            margin: 4px 0 0;
            color: #64748b;
            font-size: 10px;
        }

        .card-body {
            padding: 18px;
        }

        .chart-wrap {
            height: 330px;
        }

        .chart-empty-state {
            min-height: 220px;
            display: grid;
            place-items: center;
            padding: 24px;
            border: 1px dashed rgba(180, 207, 211, .18);
            border-radius: 10px;
            color: #9aadaf !important;
            text-align: center;
            line-height: 1.6;
        }

        .mini-chart {
            height: 235px;
        }

        .status-panel {
            min-height: 235px;
            display: grid;
            place-items: center;
            text-align: center;
        }

        .status-circle {
            width: 92px;
            height: 92px;
            margin: auto;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: rgba(16, 185, 129, 0.10);
            border: 8px solid rgba(16, 185, 129, 0.18);
            color: #34d399;
            font-size: 19px;
            font-weight: 900;
        }

        .status-circle.down {
            background: rgba(239, 68, 68, 0.10);
            border-color: rgba(239, 68, 68, 0.18);
            color: #f87171;
        }

        .status-title {
            margin-top: 13px;
            font-size: 15px;
            font-weight: 900;
        }

        .status-detail {
            margin-top: 5px;
            color: var(--muted);
            font-size: 10px;
        }

        .summary {
            display: grid;
            gap: 12px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            color: #94a3b8;
            font-size: 10px;
        }

        .summary-row strong {
            color: #e2e8f0;
            font-size: 11px;
        }

        .summary-divider {
            height: 1px;
            background: #1d2c4b;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 680px;
        }

        th,
        td {
            padding: 12px 18px;
            border-bottom: 1px solid #1d2c4b;
            text-align: left;
            font-size: 10px;
        }

        th {
            color: #64748b;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        td {
            color: #cbd5e1;
            font-weight: 600;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 8px;
            border-radius: 999px;
            font-size: 9px;
            font-weight: 900;
        }

        .badge.up {
            color: #34d399;
            background: rgba(16, 185, 129, 0.12);
        }

        .badge.down {
            color: #f87171;
            background: rgba(239, 68, 68, 0.12);
        }

        .status-circle.slow {
            background: rgba(245, 158, 11, 0.10);
            border-color: rgba(245, 158, 11, 0.24);
            color: #d97706;
        }

        .badge.slow {
            color: #b45309;
            background: rgba(245, 158, 11, 0.14);
        }

        .badge.unknown {
            color: #fbbf24;
            background: rgba(245, 158, 11, 0.12);
        }

        .empty {
            padding: 35px;
            text-align: center;
            color: var(--muted);
            font-size: 11px;
        }

        .error {
            padding: 30px;
            text-align: center;
            color: #fca5a5;
            font-size: 12px;
        }

        .error strong {
            display: block;
            color: #f87171;
            margin-bottom: 6px;
        }

        .loading {
            min-height: 300px;
            display: grid;
            place-items: center;
            color: var(--muted);
            font-size: 12px;
        }

        .loader {
            width: 28px;
            height: 28px;
            border: 3px solid #243553;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        .last-update {
            color: #64748b;
            font-size: 9px;
            text-align: right;
            margin-top: 8px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 1050px) {
            .metrics {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 720px) {
            .layout {
                display: block;
            }

            .sidebar {
                width: 100%;
                border-right: 0;
                border-bottom: 1px solid var(--border);
                padding: 12px;
            }

            .brand {
                padding-bottom: 12px;
            }

            .menu-label {
                display: none;
            }

            .nav {
                grid-template-columns: repeat(4, 1fr);
            }

            .nav a {
                justify-content: center;
                font-size: 9px;
            }

            .main {
                padding: 18px;
            }

            .topbar {
                flex-direction: column;
            }

            .top-actions {
                width: 100%;
                justify-content: stretch;
            }

            .top-actions .btn {
                flex: 1;
            }

            .toolbar {
                align-items: flex-start;
                flex-direction: column;
            }
        }

        @media (max-width: 480px) {
            .metrics {
                grid-template-columns: 1fr;
            }

            .nav a span {
                display: none;
            }
        }

        <a href="/app/analytics.html" class="active" aria-current="page"><span class="nav-icon">◈</span><span>Analytics</span></a>
        <a href="/app/logs.html"><span class="nav-icon">☷</span><span>Logs</span></a>
        <a href="/app/incidents.html"><span class="nav-icon">!</span><span>Incidents</span></a>

                </select>

                    <option value="7d" selected>Last 7 days</option>
                    <option value="30d">Last 30 days</option>
                </select>

<script>
    const token = localStorage.getItem("access_token");

    if (!token) {
        window.location.href = "/app/user_login.html";
    }

    let monitors = [];
    let selectedMonitorId = null;
    let latencyChart = null;
    let uptimeChart = null;
    let refreshTimer = null;
    let firstLoad = true;

    function goBack() {
        window.location.href = "/app/dashboard.html";
    }

    function authHeaders() {
        return {
            "Authorization": "Bearer " + token,
            "Accept": "application/json"
        };
    }

    async function apiFetch(url) {
        const response = await fetch(url, {
            method: "GET",
            headers: authHeaders()
        });

        if (response.status === 401 || response.status === 403) {
            localStorage.removeItem("access_token");
            localStorage.removeItem("refresh_token");
            window.location.href = "/app/user_login.html";
            throw new Error("Session expired.");
        }

        if (!response.ok) {
            throw new Error("Request returned HTTP " + response.status);
        }

        return response.json();
    }

    async function loadMonitorList() {
        const data = await apiFetch("/api/monitoring/analytics/");

        monitors = Array.isArray(data)
            ? data
            : (Array.isArray(data.monitors) ? data.monitors : []);

        const select = document.getElementById("monitorSelect");

        if (!monitors.length) {
            select.innerHTML = `<option value="">No APIs available</option>`;
            document.getElementById("content").innerHTML = `
                <div class="card">
                    <div class="empty">
                        No monitored APIs are available for this account.
                    </div>
                </div>
            `;
            return false;
        }

        select.innerHTML = monitors.map(monitor => `
            <option value="${escapeAttribute(monitor.monitor_id)}">
                ${escapeHTML(monitor.name || "Unnamed API")}
            </option>
        `).join("");

        const params = new URLSearchParams(window.location.search);
        const urlMonitorId = params.get("monitor_id");

        selectedMonitorId =
            monitors.some(m => String(m.monitor_id) === String(urlMonitorId))
                ? String(urlMonitorId)
                : String(monitors[0].monitor_id);

        select.value = selectedMonitorId;

        return true;
    }

    function selectMonitor() {
        selectedMonitorId =
            document.getElementById("monitorSelect").value;

        const url = new URL(window.location.href);

        if (selectedMonitorId) {
            url.searchParams.set("monitor_id", selectedMonitorId);
        } else {
            url.searchParams.delete("monitor_id");
        }

        window.history.replaceState({}, "", url);

        loadSelectedAnalytics();
    }

    async function loadSelectedAnalytics(showLoader = firstLoad) {
        if (!selectedMonitorId) {
            return;
        }

        const period =
            document.getElementById("periodSelect").value;

        const currentUrl = new URL(window.location.href);
        currentUrl.searchParams.set("period", period);

        if (selectedMonitorId) {
            currentUrl.searchParams.set("monitor_id", selectedMonitorId);
        }

        window.history.replaceState({}, "", currentUrl);

        const content = document.getElementById("content");
        const refreshBtn = document.getElementById("refreshBtn");

        if (showLoader) {
            content.innerHTML = `
                <div class="loading">
                    <div>
                        <div class="loader"></div>
                        Loading analytics...
                    </div>
                </div>
            `;
        }

        refreshBtn.textContent = "↻ Loading...";
        refreshBtn.disabled = true;

        try {
            const analyticsUrl =
                "/api/monitoring/analytics/"
                + "?monitor_id="
                + encodeURIComponent(selectedMonitorId)
                + "&period="
                + encodeURIComponent(period);

            const data = await apiFetch(analyticsUrl);

            // Diagnostic logging: inspect the exact backend payload for the
            // selected monitor/period before changing any data calculations.
            console.groupCollapsed("[API Monitor Analytics] Response");
            console.info("Request:", analyticsUrl);
            console.info("Selected monitor:", selectedMonitorId);
            console.info("Selected period:", period);
            console.info("Payload:", data);
            console.info("Data keys:", data && typeof data === "object" ? Object.keys(data) : []);
            console.info("Check totals:", {
                total_checks: data?.total_checks,
                up_checks: data?.up_checks,
                down_checks: data?.down_checks,
                history_length: Array.isArray(data?.history) ? data.history.length : null,
                checks_length: Array.isArray(data?.checks) ? data.checks.length : null
            });
            console.groupEnd();

            renderAnalytics(data);
            firstLoad = false;

        } catch (error) {
            console.error("Analytics error:", error);

            if (showLoader) {
                content.innerHTML = `
                    <div class="card">
                        <div class="error">
                            <strong>Unable to load analytics</strong>
                            ${escapeHTML(error.message)}
                        </div>
                    </div>
                `;
            }

        } finally {
            refreshBtn.textContent = "↻ Refresh";
            refreshBtn.disabled = false;
        }
    }

    function changeResponsePeriod() {
        const responseSelect = document.getElementById("responsePeriodSelect");
        const periodSelect = document.getElementById("periodSelect");

        if (!responseSelect || !periodSelect) return;

        periodSelect.value = responseSelect.value;

        const url = new URL(window.location.href);
        url.searchParams.set("period", responseSelect.value);

        if (selectedMonitorId) {
            url.searchParams.set("monitor_id", selectedMonitorId);
        }

        window.history.replaceState({}, "", url);
        loadSelectedAnalytics(true);
    }

    async function refreshAnalytics() {
        if (!selectedMonitorId) {
            await initialLoad();
            return;
        }

        await loadSelectedAnalytics(false);
    }

    async function initialLoad() {
        try {
            const params = new URLSearchParams(window.location.search);
            const urlPeriod = params.get("period");
            const periodSelect = document.getElementById("periodSelect");

            if (periodSelect && ["24h", "7d", "30d"].includes(urlPeriod)) {
                periodSelect.value = urlPeriod;
            }

            const hasMonitors = await loadMonitorList();

            if (hasMonitors) {
                await loadSelectedAnalytics(true);
            }
        } catch (error) {
            console.error("Analytics initialization error:", error);

            document.getElementById("content").innerHTML = `
                <div class="card">
                    <div class="error">
                        <strong>Unable to load APIs</strong>
                        ${escapeHTML(error.message)}
                    </div>
                </div>
            `;
        }
    }

    function renderAnalytics(data) {
        const uptime = numberOrNull(data.uptime_percentage);
        const avg = numberOrNull(data.avg_response_time);
        const p95 = numberOrNull(data.p95_latency);
        const total = numberOrNull(data.total_checks);
        const up = numberOrNull(data.up_checks);
        const down = numberOrNull(data.down_checks);
        const threshold = numberOrNull(data.response_time_threshold_ms);
        const performanceScore = numberOrNull(data.performance_score);
        const performanceGrade = data.performance_grade || null;
        const scoreBreakdown = data.score_breakdown || {};
        const insights = Array.isArray(data.insights) ? data.insights : [];
        const latencyTrend = String(data.latency_trend || "stable").toLowerCase();
        const anomaly = data.anomaly && typeof data.anomaly === "object"
            ? data.anomaly
            : {
                severity: "normal",
                kind: "none",
                title: "No anomaly detected",
                detail: "Recent monitoring behavior is within the normal range."
            };

        const status = String(data.status || "").toUpperCase();
        const slowChecks = numberOrNull(data.slow_checks) ?? 0;
        const slowPercentage = numberOrNull(data.slow_percentage) ?? 0;
        const isDown = status === "DOWN";
        // Availability and performance are separate: an API can be reachable
        // (UP) while its response time exceeds the configured threshold.
        const isSlow = !isDown && (
            status === "SLOW" || slowChecks > 0 || slowPercentage > 0
        );
        const hasChecks = total !== null && total > 0;
        const healthLabel = isDown ? "DOWN" : (isSlow ? "SLOW" : "UP");
        const healthTitle = isDown
            ? "API needs attention"
            : (isSlow ? "API is reachable, but slow" : "API is healthy");
        const uptimeDisplay = hasChecks ? formatPercent(uptime) : "No data";
        const avgDisplay = hasChecks ? formatMs(avg) : "No data";
        const p95Display = hasChecks ? formatMs(p95) : "No data";

        document.getElementById("pageTitle").textContent =
            (data.name || "API") + " Analytics";

        document.getElementById("pageSubtitle").textContent =
            data.url || "API performance and uptime insights.";

        document.getElementById("content").innerHTML = `
            <section class="metrics">

                <div class="metric">
                    <div class="metric-label">Uptime</div>
                    <div class="metric-value">
                        ${uptimeDisplay}
                    </div>
                    <div class="metric-help">
                        ${formatNumber(up)} successful / ${formatNumber(total)} checks
                    </div>
                </div>

                <div class="metric">
                    <div class="metric-label">Average Response</div>
                    <div class="metric-value">
                        ${avgDisplay}
                    </div>
                    <div class="metric-help">
                        Average API latency
                    </div>
                </div>

                <div class="metric">
                    <div class="metric-label">P95 Latency</div>
                    <div class="metric-value">
                        ${p95Display}
                    </div>
                    <div class="metric-help">
                        95% of recorded responses are at or below this value
                    </div>
                </div>

                <div class="metric">
                    <div class="metric-label">Total Checks</div>
                    <div class="metric-value">
                        ${formatNumber(total)}
                    </div>
                    <div class="metric-help">
                        ${formatNumber(down)} failed checks
                    </div>
                </div>

            </section>

            <section class="grid">

                <div class="card">
                    <div class="card-header">
                        <div>
                            <h2 class="card-title">Response Time</h2>
                            <p class="card-subtitle">
                                Average latency for each time bucket
                            </p>
                        </div>

                        <select id="responsePeriodSelect"
                                class="control response-period-control"
                                onchange="changeResponsePeriod()"
                                aria-label="Response time period">
                            <option value="24h">Last 24 hours</option>
                            <option value="7d">Last 7 days</option>
                            <option value="30d">Last 30 days</option>
                        </select>
                    </div>

                    <div class="card-body">
                        <div class="chart-wrap">
                            <canvas id="latencyChart"></canvas>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <div>
                            <h2 class="card-title">Availability</h2>
                            <p class="card-subtitle">
                                Current monitoring state
                            </p>
                        </div>
                    </div>

                    <div class="card-body">
                        <div class="status-panel">

                            <div>
                                <div class="status-circle ${isDown ? "down" : (isSlow ? "slow" : "")}">
                                    ${healthLabel}
                                </div>

                                <div class="status-title">
                                    ${healthTitle}
                                </div>

                                <div class="status-detail">
                                    ${formatPercent(uptime)} uptime
                                    · ${formatNumber(down)} failed checks
                                    ${isSlow ? ` · ${formatNumber(slowChecks)} slow checks (${formatPercent(slowPercentage)})` : ""}
                                </div>
                            </div>

                        </div>
                    </div>
                </div>

            </section>

            <section class="grid">

                <div class="card">
                    <div class="card-header">
                        <div>
                            <h2 class="card-title">Uptime History</h2>
                            <p class="card-subtitle">
                                Availability percentage across the selected period
                            </p>
                        </div>
                    </div>

                    <div class="card-body">
                        <div class="mini-chart">
                            <canvas id="uptimeChart"></canvas>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <div>
                            <h2 class="card-title">Performance Summary</h2>
                            <p class="card-subtitle">
                                Selected API configuration
                            </p>
                        </div>
                    </div>

                    <div class="card-body">
                        <div class="summary">

                            <div class="summary-row">
                                <span>Current status</span>
                                <strong>
                                    <span class="badge ${isDown ? "down" : (isSlow ? "slow" : "up")}">
                                        ${isDown ? "● DOWN" : (isSlow ? "● SLOW" : "● UP")}
                                    </span>
                                </strong>
                            </div>

                            <div class="summary-row">
                                <span>Slow threshold</span>
                                <strong>${formatMs(threshold)}</strong>
                            </div>

                            <div class="summary-row">
                                <span>Average response</span>
                                <strong>${formatMs(avg)}</strong>
                            </div>

                            <div class="summary-row">
                                <span>P95 latency</span>
                                <strong>${formatMs(p95)}</strong>
                            </div>

                            <div class="summary-divider"></div>

                            <div class="summary-row">
                                <span>Successful checks</span>
                                <strong>${formatNumber(up)}</strong>
                            </div>

                            <div class="summary-row">
                                <span>Failed checks</span>
                                <strong>${formatNumber(down)}</strong>
                            </div>

                            <div class="summary-row">
                                <span>Availability</span>
                                <strong>${formatPercent(uptime)}</strong>
                            </div>

                        </div>
                    </div>
                </div>

            </section>


            <section class="card score-card">
                <div class="card-header">
                    <div>
                        <h2 class="card-title">Performance Score</h2>
                        <p class="card-subtitle">
                            A single health score calculated from real monitoring data
                        </p>
                    </div>

    function renderHealthTimeline(history, incidents, threshold, period) {
        const timeline = document.getElementById("healthTimeline");
        const detail = document.getElementById("healthTimelineDetail");

        if (!timeline || !detail) return;

        if (!Array.isArray(history) || !history.length) {
            timeline.innerHTML = `<div class="empty">No monitoring history is available for the selected period.</div>`;
            detail.innerHTML = `<div class="health-detail-empty">There is no timeline data to inspect.</div>`;
            return;
        }

        const bucketSeconds = period === "24h"
            ? 30 * 60
            : period === "30d"
                ? 12 * 60 * 60
                : 3 * 60 * 60;

        const safeIncidents = Array.isArray(incidents) ? incidents : [];
        const safeThreshold = numberOrNull(threshold);

        timeline.innerHTML = `
            <div class="health-axis">
                <span>${escapeHTML(formatChartLabel(history[0].timestamp))}</span>
                <span>${escapeHTML(formatChartLabel(history[Math.floor(history.length / 2)].timestamp))}</span>
                <span>${escapeHTML(formatChartLabel(history[history.length - 1].timestamp))}</span>
            </div>
            <div class="health-track" id="healthTrack"></div>
        `;

        const track = document.getElementById("healthTrack");
        if (!track) return;

        history.forEach((item, index) => {
            const start = new Date(item.timestamp);
            const startMs = start.getTime();
            const endMs = startMs + bucketSeconds * 1000;
            const downChecks = Number(item.down_checks || 0);
            const latency = numberOrNull(item.latency);

            let state = "up";
            if (downChecks > 0) {
                state = "down";
            } else if (safeThreshold !== null && latency !== null && latency > safeThreshold) {
                state = "slow";
            }

            const relatedIncident = safeIncidents.find(incident => {
                const incidentStart = new Date(incident.started_at).getTime();
                const incidentEnd = incident.resolved_at
                    ? new Date(incident.resolved_at).getTime()
                    : Date.now();
                return incidentStart < endMs && incidentEnd >= startMs;
            });

            const button = document.createElement("button");
            button.type = "button";
            button.className = `health-segment ${state}`;

            if (relatedIncident) {
                button.classList.add("incident-linked");
            }

            const incidentLabel = relatedIncident
                ? ` · Incident #${relatedIncident.id}`
                : "";

            button.title =
                `${state.toUpperCase()} · ${formatChartLabel(item.timestamp)}${incidentLabel}`;

            button.setAttribute("aria-label", button.title);

            button.addEventListener("click", () => {
                document.querySelectorAll(".health-segment.active").forEach(el => el.classList.remove("active"));
                button.classList.add("active");
                renderHealthTimelineDetail(item, state, relatedIncident);
            });

            track.appendChild(button);

            if (index === history.length - 1 && history.length === 1) {
                button.style.minWidth = "100%";
            }
        });

        const downIncident = safeIncidents.find(incident => String(incident.status).toUpperCase() === "ONGOING");
        if (downIncident) {
            detail.innerHTML = `<div class="health-detail-empty">An incident is currently ongoing. Click the red timeline period to view its details.</div>`;
        }
    }

    function renderHealthTimelineDetail(item, state, incident) {
        const detail = document.getElementById("healthTimelineDetail");
        if (!detail) return;

        const labels = {
            up: "UP",
            slow: "SLOW",
            down: "DOWN"
        };

        if (!incident) {
            detail.innerHTML = `
                <div class="health-detail-head">
                    <div class="health-detail-title">Health period</div>
                    <span class="health-status-pill ${state}">● ${labels[state]}</span>
                </div>
                <div class="health-detail-grid">
                    <div><div class="health-detail-label">Period</div><div class="health-detail-value">${escapeHTML(formatChartLabel(item.timestamp))}</div></div>
                    <div><div class="health-detail-label">Checks</div><div class="health-detail-value">${formatNumber(item.checks)}</div></div>
                    <div><div class="health-detail-label">UP checks</div><div class="health-detail-value">${formatNumber(item.up_checks)}</div></div>
                    <div><div class="health-detail-label">DOWN checks</div><div class="health-detail-value">${formatNumber(item.down_checks)}</div></div>
                </div>
                <div class="health-detail-reason">No incident record overlaps this period.</div>
            `;
            return;
        }

        detail.innerHTML = `
            <div class="health-detail-head">
                <div class="health-detail-title">Incident #${escapeHTML(String(incident.id))}</div>
                <span class="health-status-pill down">● ${escapeHTML(String(incident.status || "INCIDENT").toUpperCase())}</span>
            </div>
            <div class="health-detail-grid">
                <div><div class="health-detail-label">Started</div><div class="health-detail-value">${escapeHTML(formatDateTime(incident.started_at))}</div></div>
                <div><div class="health-detail-label">Resolved</div><div class="health-detail-value">${escapeHTML(formatDateTime(incident.resolved_at))}</div></div>
                <div><div class="health-detail-label">Duration</div><div class="health-detail-value">${escapeHTML(formatDuration(incident.duration_seconds))}</div></div>
                <div><div class="health-detail-label">Monitor</div><div class="health-detail-value">${escapeHTML(incident.monitor_name || "—")}</div></div>

    function formatDuration(seconds) {
        const value = numberOrNull(seconds);
        if (value === null) return "Ongoing";

        const total = Math.max(0, Math.round(value));
        const days = Math.floor(total / 86400);
        const hours = Math.floor((total % 86400) / 3600);
        const minutes = Math.floor((total % 3600) / 60);
        const secs = total % 60;

        const parts = [];
        if (days) parts.push(days + "d");
        if (hours) parts.push(hours + "h");
        if (minutes) parts.push(minutes + "m");
        if (secs || !parts.length) parts.push(secs + "s");

        return parts.join(" ");
    }

    function renderAnomaly(anomaly, isSlow = false, slowPercentage = 0, threshold = null, history = [], checks = []) {
        const badge = document.getElementById("anomalyBadge");
        const title = document.getElementById("anomalyTitle");
        const detail = document.getElementById("anomalyDetail");
        const current = document.getElementById("anomalyCurrent");
        const baseline = document.getElementById("anomalyBaseline");
        const affected = document.getElementById("anomalyAffected");

        if (!badge || !title || !detail) return;

        const severity = ["normal", "warning", "critical"].includes(
            String(anomaly?.severity || "").toLowerCase()
        )
            ? String(anomaly.severity).toLowerCase()
            : "normal";

        const labels = {
            normal: "● NORMAL",
            warning: "● WARNING",
            critical: "● CRITICAL"
        };

        badge.className = `anomaly-badge ${severity}`;
        badge.textContent = labels[severity];

        const hasThresholdDegradation = Boolean(isSlow) && Number(slowPercentage) > 0;

        // History is ordered from oldest to newest; checks are rendered newest first.
        // Use only real measurements supplied by the analytics API.
        const historySamples = (Array.isArray(history) ? history : [])
            .map(item => numberOrNull(item?.latency))
            .filter(value => value !== null && value >= 0);

        const checkSamples = (Array.isArray(checks) ? checks : [])
            .map(item => numberOrNull(item?.response_time_ms))
            .filter(value => value !== null && value >= 0);

        const derivedCurrent = historySamples.length
            ? historySamples[historySamples.length - 1]
            : (checkSamples.length ? checkSamples[0] : null);

        // Prefer a historical baseline that excludes the latest history point.
        // If history has too few samples, use the available check measurements,
        // excluding the newest check when possible.
        let baselineSamples = historySamples.slice(0, -1);
        if (!baselineSamples.length && checkSamples.length > 1) {
            baselineSamples = checkSamples.slice(1);
        }
        if (!baselineSamples.length && historySamples.length) {
            baselineSamples = historySamples;
        }
        if (!baselineSamples.length && checkSamples.length) {
            baselineSamples = checkSamples;
        }

        const derivedBaseline = baselineSamples.length
            ? baselineSamples.reduce((sum, value) => sum + value, 0) / baselineSamples.length
            : null;

        const recentWindow = historySamples.length
            ? historySamples.slice(-Math.min(5, historySamples.length))
            : checkSamples.slice(0, Math.min(5, checkSamples.length));

        // "Affected" counts recent measurements >= 50% above the historical
        // baseline. This is separate from the slow-threshold percentage.
        const derivedAffected = derivedBaseline !== null && derivedBaseline > 0
            ? recentWindow.filter(value => value >= derivedBaseline * 1.5).length
            : 0;

        title.textContent = hasThresholdDegradation && severity === "normal"
            ? "No sudden anomaly detected"
            : (anomaly?.title || "No anomaly detected");

        detail.textContent = hasThresholdDegradation && severity === "normal"
            ? `Latency is consistently above the configured ${formatMs(threshold)} threshold (${formatPercent(slowPercentage)} of measured checks). No separate sudden spike was identified.`
            : (anomaly?.detail || "Recent monitoring behavior is within the normal range.");

        const currentValue = numberOrNull(anomaly?.current_ms) ?? derivedCurrent;
        const baselineValue = numberOrNull(anomaly?.baseline_ms) ?? derivedBaseline;
        const backendAffected = numberOrNull(anomaly?.affected_checks);
        const affectedValue = backendAffected !== null ? backendAffected : derivedAffected;

        if (current) {
            current.textContent = currentValue !== null ? formatMs(currentValue) : "—";
        }

        if (baseline) {
            baseline.textContent = baselineValue !== null ? formatMs(baselineValue) : "—";
        }

        if (affected) {
            affected.textContent = String(Math.max(0, Math.round(affectedValue)));
        }
    }

    function renderSmartInsights(insights, latencyTrend, slowPercentage = 0, threshold = null, isSlow = false) {
        const content = document.getElementById("insightsContent");
        const header = document.getElementById("insightsHeaderRight");

        if (!content) return;

        const safeTrend = ["improving", "degrading", "stable"].includes(latencyTrend)
            ? latencyTrend
            : "stable";

        const trendLabels = {
            improving: "Latency improving",
            degrading: "Latency degrading",
            stable: "Latency stable"
        };

        if (header) {
            header.innerHTML = `<span class="trend-badge ${safeTrend}">${escapeHTML(trendLabels[safeTrend])}</span>`;
        }

        const safeInsights = insights.map(insight => String(insight));
        const hasThresholdDegradation = Boolean(isSlow) && Number(slowPercentage) > 0;
        const thresholdInsight = hasThresholdDegradation
            ? `${formatPercent(slowPercentage)} of measured checks exceeded the configured ${formatMs(threshold)} response-time threshold. The API is reachable, but performance is degraded.`
            : null;

        // Add the threshold explanation even if backend insights are empty or
        // the latency trend is stable. Stable means no material trend change;
        // it does not mean latency is within the configured threshold.
        if (thresholdInsight && !safeInsights.some(item => item.toLowerCase().includes("exceeded the configured response-time threshold"))) {
            safeInsights.unshift(thresholdInsight);
        }

        if (!safeInsights.length) {
            content.innerHTML = `<div class="insights-empty">No additional insights were detected for the selected period.</div>`;
            return;
        }

        content.innerHTML = safeInsights.slice(0, 5).map(insight => `
            <div class="insight-item">
                <span class="insight-dot"></span>
                <span>${escapeHTML(String(insight))}</span>
            </div>
        `).join("");
    }

    function renderPerformanceScore(score, grade, breakdown) {
        const ring = document.getElementById("scoreRing");
        const number = document.getElementById("scoreNumber");
        const gradeEl = document.getElementById("scoreGrade");

        const uptime = numberOrNull(breakdown.uptime);
        const latency = numberOrNull(breakdown.latency);
        const slow = numberOrNull(breakdown.slow_checks);

        const values = [
            ["scoreUptime", "scoreUptimeBar", uptime],
            ["scoreLatency", "scoreLatencyBar", latency],
            ["scoreSlow", "scoreSlowBar", slow]
        ];

        if (score === null || score === undefined) {
            if (ring) ring.style.setProperty("--score", 0);
            if (number) number.textContent = "—";
            if (gradeEl) gradeEl.textContent = "NO DATA";
        } else {
            const safeScore = Math.max(
                0,
                Math.min(100, Number(score))
            );

            if (ring) ring.style.setProperty("--score", safeScore);
            if (number) number.textContent = safeScore.toFixed(1);
            if (gradeEl) gradeEl.textContent = grade || "SCORE";
        }

        values.forEach(([textId, barId, value]) => {
            const text = document.getElementById(textId);
            const bar = document.getElementById(barId);

            if (value === null || value === undefined) {
                if (text) text.textContent = "—";
                if (bar) bar.style.width = "0%";
                return;
            }

            const safe = Math.max(
                0,
                Math.min(100, Number(value))
            );

            if (text) text.textContent = safe.toFixed(1);
            if (bar) bar.style.width = safe + "%";
        });
    }

    function drawCharts(history) {
        if (latencyChart) {
            latencyChart.destroy();
            latencyChart = null;
        }

        if (uptimeChart) {
            uptimeChart.destroy();
            uptimeChart = null;
        }

        const latencyCanvas = document.getElementById("latencyChart");
        const uptimeCanvas = document.getElementById("uptimeChart");
        const validHistory = Array.isArray(history) ? history : [];

        // Do not draw a fabricated zero-valued chart when the API returns
        // no history. The previous fallback [0] produced repeated "1 ms"
        // axis labels even though no checks existed for the selected period.
        if (!validHistory.length) {
            [latencyCanvas, uptimeCanvas].forEach(canvas => {
                if (canvas && canvas.parentElement) {
                    canvas.parentElement.innerHTML = `
                        <div class="empty chart-empty-state">
                            No monitoring history is available for the selected period.
                        </div>
                    `;
                }
            });
            return;
        }

        if (typeof Chart === "undefined") {
            return;
        }

        const labels = validHistory.map(item =>
            formatChartLabel(item.timestamp)
        );

        const latencyValues = validHistory.map(item =>
            numberOrNull(item.latency)
        );

        const uptimeValues = validHistory.map(item =>
            numberOrNull(item.uptime)
        );

        if (latencyCanvas) {
            latencyChart = new Chart(
                latencyCanvas,
                {
                    type: "line",
                    data: {
                        labels: labels,
                        datasets: [{
                            label: "Response time",
                            data: latencyValues,
                            borderColor: "#7c6cff",
                            backgroundColor: "rgba(124,108,255,0.12)",
                            fill: true,
                            tension: 0.35,
                            pointRadius: 2,
                            pointHoverRadius: 5,
                            spanGaps: true
                        }]
                    },
                    options: chartOptions("ms")
                }
            );
        }

        if (uptimeCanvas) {
            uptimeChart = new Chart(
                uptimeCanvas,
                {
                    type: "line",
                    data: {
                        labels: labels,
                        datasets: [{
                            label: "Uptime",
                            data: uptimeValues,
                            borderColor: "#10b981",
                            backgroundColor: "rgba(16,185,129,0.10)",
                            fill: true,
                            tension: 0.35,
                            pointRadius: 2,
                            pointHoverRadius: 5,
                            spanGaps: true
                        }]
                    },
                    options: chartOptions("%", 100)
                }
            );
        }
    }

    function chartOptions(unit, maxY = null) {
        return {
            responsive: true,
            maintainAspectRatio: false,

            interaction: {
                intersect: false,
                mode: "index"
            },

            plugins: {
                legend: {
                    display: false
                },

                tooltip: {
                    callbacks: {
                        label: function(context) {
                            const value = context.parsed.y;

                            if (value === null || value === undefined) {
                                return " No data";
                            }

                            return " "
                                + (unit === "%"
                                    ? Number(value).toFixed(1) + "%"
                                    : formatMs(value));
                        }
                    }
                }
            },

            scales: {
                x: {
                    grid: {
                        color: "rgba(148,163,184,0.07)"
                    },

                    ticks: {
                        color: "#64748b",
                        font: {
                            size: 9
                        },
                        maxTicksLimit: 8,
                        maxRotation: 0
                    }
                },

                y: {
                    beginAtZero: true,
                    suggestedMax: maxY,

                    grid: {
                        color: "rgba(148,163,184,0.08)"
                    },

                    ticks: {
                        color: "#64748b",
                        font: {
                            size: 9
                        },

                        callback: function(value) {
                            if (unit === "%") {
                                return Number(value).toFixed(0) + "%";
                            }

                            const numericValue = Number(value);
                            if (!Number.isFinite(numericValue)) return "";
                            if (numericValue > 0 && numericValue < 10) {
                                return numericValue.toFixed(1) + " ms";
                            }
                            return formatMs(numericValue);
                        }
                    }
                }
            }
        };
    }

    function renderChecks(checks, thresholdValue = null) {
        const body = document.getElementById("checksBody");

        if (!body) {
            return;
        }

        if (!checks.length) {
            body.innerHTML = `
                <tr>
                    <td colspan="5">
                        <div class="empty">
                            No monitoring checks in the selected period.
                        </div>
                    </td>
                </tr>
            `;
            return;
        }

        body.innerHTML = checks.map(check => {
            const rawStatus = String(check.status || "").toUpperCase();
            const isUp = rawStatus === "UP";
            const responseTime = numberOrNull(check.response_time_ms);
            const configuredThreshold = numberOrNull(thresholdValue);
            const threshold = configuredThreshold !== null && configuredThreshold > 0
                ? configuredThreshold
                : 1000;
            const isSlow = isUp && responseTime !== null && responseTime > threshold;

            // Preserve the recorded availability status and show latency as a
            // separate indicator instead of relabeling a successful HTTP check.
            const statusBadges = isUp
                ? `<span class="badge up">● UP</span>${isSlow ? ` <span class="badge slow">● SLOW</span>` : ""}`
                : rawStatus === "DOWN"
                    ? `<span class="badge down">● DOWN</span>`
                    : `<span class="badge unknown">${escapeHTML(rawStatus || "UNKNOWN")}</span>`;

            return `
                <tr>
                    <td>${escapeHTML(formatDateTime(check.checked_at))}</td>
                    <td>${statusBadges}</td>
                    <td>${formatMs(check.response_time_ms)}${isSlow ? `<div class="metric-help">Above ${formatMs(threshold)} threshold</div>` : ""}</td>
                    <td>${check.status_code ?? "—"}</td>
                    <td>${escapeHTML(check.error_message || "—")}</td>
                </tr>
            `;
        }).join("");
    }

    function numberOrNull(value) {
        if (
            value === null ||
            value === undefined ||
            value === ""
        ) {
            return null;
        }

        const number = Number(value);

        return Number.isFinite(number)
            ? number
            : null;
    }

    function formatNumber(value) {
        const number = numberOrNull(value);

        if (number === null) {
            return "—";
        }

        return new Intl.NumberFormat("en-IN").format(
            Math.round(number)
        );
    }

    function formatMs(value) {
        const number = numberOrNull(value);

        if (number === null) {
            return "—";
        }

        if (number >= 1000) {
            return (number / 1000).toFixed(2) + " s";
        }

        return Math.round(number).toLocaleString("en-IN") + " ms";
    }

    function formatPercent(value) {
        const number = numberOrNull(value);

        if (number === null) {
            return "—";
        }

        return number.toFixed(2).replace(/\.00$/, "") + "%";
    }

    function formatDateTime(value) {
        if (!value) {
            return "—";
        }

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
            return String(value);
        }

        return date.toLocaleString([], {
            dateStyle: "short",
            timeStyle: "short"
        });
    }

    function formatChartLabel(value) {
        if (!value) {
            return "";
        }

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
            return String(value);
        }

        return date.toLocaleString([], {
            month: "short",
            day: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        });
    }

    function escapeHTML(value) {
        const div = document.createElement("div");
        div.textContent = value ?? "";
        return div.innerHTML;
    }

    function escapeAttribute(value) {
        return escapeHTML(String(value))
            .replace(/"/g, "&quot;");
    }

    initialLoad();

    refreshTimer = setInterval(
        () => loadSelectedAnalytics(false),
        30000
    );
</script>

</body>
