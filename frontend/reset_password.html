<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — API Monitor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0f1e;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: #111827;
            border: 1px solid rgba(99, 102, 241, .18);
            border-radius: 18px;
            padding: 40px 36px;
            width: 100%;
            max-width: 420px;
            animation: fadeIn .4s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        .logo {
            font-size: 1rem;
            font-weight: 700;
            background: linear-gradient(135deg, #6366f1, #a78bfa);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        h1 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .sub {
            color: #64748b;
            font-size: .82rem;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: .78rem;
            font-weight: 500;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        .input-wrap {
            position: relative;
        }

        input[type=password] {
            width: 100%;
            background: #0d1526;
            border: 1px solid rgba(99, 102, 241, .18);
            color: #e2e8f0;
            border-radius: 9px;
            padding: 11px 42px 11px 14px;
            font-size: .875rem;
            font-family: inherit;
            outline: none;
            transition: border-color .2s;
        }

        input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, .15);
        }

        .eye-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #64748b;
            padding: 4px;
        }

        .strength-bar {
            display: flex;
            gap: 4px;
            margin-top: 6px;
        }

        .sb {
            flex: 1;
            height: 3px;
            border-radius: 2px;
            background: #1e293b;
            transition: background .3s;
        }

        .strength-label {
            font-size: .68rem;
            color: #64748b;
            margin-top: 4px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 9px;
            font-size: .9rem;
            font-weight: 600;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            border: none;
            cursor: pointer;
            font-family: inherit;
            transition: opacity .2s;
            margin-top: 6px;
        }

        .btn:hover {
            opacity: .9;
        }

        .btn:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        .alert {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: .8rem;
            font-weight: 500;
            margin-bottom: 14px;
            display: none;
        }

        .alert-err {
            background: rgba(248, 113, 113, .12);
            border: 1px solid rgba(248, 113, 113, .3);
            color: #fca5a5;
        }

        .alert-ok {
            background: rgba(74, 222, 128, .12);
            border: 1px solid rgba(74, 222, 128, .3);
            color: #86efac;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #64748b;
            font-size: .8rem;
            text-decoration: none;
        }

        .back-link:hover {
            color: #818cf8;
        }

        .success-state {
            text-align: center;
            padding: 16px 0;
        }

        .success-icon {
            font-size: 3rem;
            margin-bottom: 12px;
        }
    </style>

    <link rel="stylesheet" href="theme.css">
</head>

<body>

    <div class="card">

        <div class="logo">⬡ API Monitor</div>

        <h1>Set New Password</h1>

        <p class="sub">
            Enter a strong new password for your account.
        </p>

        <div id="alert" class="alert alert-err"></div>

        <div id="form-area">

            <div class="form-group">

                <label>New Password</label>

                <div class="input-wrap">

                    <input
                        type="password"
                        id="pw1"
                        placeholder="At least 6 characters"
                        oninput="checkStrength()"
                    >

                    <button
                        class="eye-btn"
                        type="button"
                        onclick="togglePw('pw1',this)"
                    >
                        👁
                    </button>

                </div>

                <div class="strength-bar">
                    <div class="sb" id="s1"></div>
                    <div class="sb" id="s2"></div>
                    <div class="sb" id="s3"></div>
                    <div class="sb" id="s4"></div>
                </div>

                <div
                    class="strength-label"
                    id="strength-label"
                >
                    Enter password
                </div>

            </div>


            <div class="form-group">

                <label>Confirm Password</label>

                <div class="input-wrap">

                    <input
                        type="password"
                        id="pw2"
                        placeholder="Repeat your new password"
                    >

                    <button
                        class="eye-btn"
                        type="button"
                        onclick="togglePw('pw2',this)"
                    >
                        👁
                    </button>

                </div>

            </div>


            <button
                class="btn"
                id="submit-btn"
                onclick="resetPassword()"
            >
                Reset Password
            </button>

        </div>


        <div
            id="success-state"
            class="success-state"
            style="display:none;"
        >

            <div class="success-icon">
                ✅
            </div>

            <h2
                style="font-size:1.1rem;margin-bottom:8px;"
            >
                Password Reset!
            </h2>

            <p
                style="color:#64748b;font-size:.82rem;"
            >
                Your password has been changed successfully.
            </p>

            <a
                href="user_login.html"
                style="
                    display:inline-block;
                    margin-top:20px;
                    padding:11px 28px;
                    border-radius:9px;
                    background:linear-gradient(135deg,#6366f1,#8b5cf6);
                    color:#fff;
                    font-weight:600;
                    text-decoration:none;
                    font-size:.875rem;
                "
            >
                Go to Login →
            </a>

        </div>


        <a
            href="user_login.html"
            class="back-link"
        >
            ← Back to Login
        </a>

    </div>


    <script>

        /*
         * IMPORTANT:
         *
         * Use the same backend that served this page.
         *
         * Local:
         * http://127.0.0.1:8000/api/users
         *
         * Production:
         * https://api-monitor-production-9679.up.railway.app/api/users
         *
         * Using a relative URL automatically selects the correct one.
         */

        const API_BASE = '/api/users';


        /*
         * Read reset token from the email URL.
         *
         * Example:
         * /app/reset_password.html?token=ABC123
         */

        const token =
            new URLSearchParams(location.search).get('token') || '';


        /*
         * Make sure a token actually exists.
         */

        if (!token) {

            const alertBox =
                document.getElementById('alert');

            alertBox.textContent =
                'No reset token found. Please use the link from your email.';

            alertBox.className =
                'alert alert-err';

            alertBox.style.display =
                'block';

            document.getElementById(
                'submit-btn'
            ).disabled = true;
        }


        /*
         * Show / hide password.
         */

        function togglePw(id, btn) {

            const input =
                document.getElementById(id);

            input.type =
                input.type === 'password'
                    ? 'text'
                    : 'password';

            btn.textContent =
                input.type === 'password'
                    ? '👁'
                    : '🙈';
        }


        /*
         * Password strength indicator.
         */

        function checkStrength() {

            const pw =
                document.getElementById('pw1').value;

            const bars = [
                's1',
                's2',
                's3',
                's4'
            ];

            const scores = [

                pw.length >= 6,

                pw.length >= 10,

                /[A-Z]/.test(pw) ||
                /[0-9]/.test(pw),

                /[!@#$%^&*()_+\-=\[\]{}|;',.<>?]/.test(pw)

            ];

            const level =
                scores.filter(Boolean).length;

            const colors = [
                '#f87171',
                '#fbbf24',
                '#fbbf24',
                '#4ade80'
            ];

            const labels = [
                'Too Short',
                'Weak',
                'Fair',
                'Strong'
            ];


            bars.forEach((id, i) => {

                document.getElementById(id).style.background =
                    i < level
                        ? colors[level - 1]
                        : '#1e293b';

            });


            document.getElementById(
                'strength-label'
            ).textContent =
                pw
                    ? labels[level - 1] || 'Too Short'
                    : 'Enter password';


            document.getElementById(
                'strength-label'
            ).style.color =
                pw
                    ? (colors[level - 1] || '#f87171')
                    : '#64748b';
        }


        /*
         * Submit password reset.
         */

        async function resetPassword() {

            const pw1 =
                document.getElementById('pw1').value;

            const pw2 =
                document.getElementById('pw2').value;

            const alertBox =
                document.getElementById('alert');


            /*
             * Validate password.
             */

            if (!pw1 || pw1.length < 6) {

                alertBox.textContent =
                    'Password must be at least 6 characters.';

                alertBox.className =
                    'alert alert-err';

                alertBox.style.display =
                    'block';

                return;
            }


            /*
             * Confirm passwords match.
             */

            if (pw1 !== pw2) {

                alertBox.textContent =
                    'Passwords do not match.';

                alertBox.className =
                    'alert alert-err';

                alertBox.style.display =
                    'block';

                return;
            }


            /*
             * Make sure token exists.
             */

            if (!token) {

                alertBox.textContent =
                    'No reset token found. Please use the link from your email.';

                alertBox.className =
                    'alert alert-err';

                alertBox.style.display =
                    'block';

                return;
            }


            const btn =
                document.getElementById('submit-btn');

            btn.disabled = true;

            btn.textContent =
                'Resetting…';

            alertBox.style.display =
                'none';


            try {

                /*
                 * Send the token and new password
                 * to the SAME backend serving this page.
                 */

                const response =
                    await fetch(
                        `${API_BASE}/reset-password/`,
                        {
                            method: 'POST',

                            headers: {
                                'Content-Type':
                                    'application/json'
                            },

                            body: JSON.stringify({
                                token: token,
                                password: pw1
                            })
                        }
                    );


                const data =
                    await response.json();


                /*
                 * Successful reset.
                 */

                if (response.ok) {

                    document.getElementById(
                        'form-area'
                    ).style.display =
                        'none';

                    document.getElementById(
                        'success-state'
                    ).style.display =
                        'block';

                    return;
                }


                /*
                 * Backend returned an error.
                 */

                alertBox.textContent =
                    data.error ||
                    'Reset failed. The link may have expired.';

                alertBox.className =
                    'alert alert-err';

                alertBox.style.display =
                    'block';


            } catch (error) {

                console.error(
                    'Password reset error:',
                    error
                );

                alertBox.textContent =
                    'Cannot connect to server.';

                alertBox.className =
                    'alert alert-err';

                alertBox.style.display =
                    'block';


            } finally {

                btn.disabled = false;

                btn.textContent =
                    'Reset Password';
            }
        }


        /*
         * Allow Enter key to submit.
         */

        document
            .querySelectorAll('input')
            .forEach(input => {

                input.addEventListener(
                    'keydown',
                    event => {

                        if (event.key === 'Enter') {

                            resetPassword();
                        }
                    }
                );

            });

    </script>

</body>

</html>
