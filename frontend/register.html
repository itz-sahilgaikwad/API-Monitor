==================<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - API Monitor</title>
    <meta name="description" content="Register a new API Monitor account">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Extend base styles for multi-step form */
        .login-container {
            max-width: 460px;
        }

        .steps-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0;
            margin-bottom: 2rem;
        }

        .step-dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .step-dot.active {
            background: rgba(99, 102, 241, 0.3);
            color: white;
            border-color: #818cf8;
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.5);
        }

        .step-dot.done {
            background: rgba(34, 197, 94, 0.25);
            color: #4ade80;
            border-color: #4ade80;
        }

        .step-line {
            flex: 1;
            height: 2px;
            background: rgba(255, 255, 255, 0.08);
            margin: 0 4px;
            transition: background 0.3s;
            max-width: 60px;
        }

        .step-line.done {
            background: rgba(34, 197, 94, 0.4);
        }

        .step-panel {
            display: none;
        }

        .step-panel.active {
            display: block;
        }

        .input-with-icon {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.3);
            pointer-events: none;
        }

        .form-input.has-icon {
            padding-left: 2.75rem;
        }

        .strength-bar {
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.08);
            margin-top: 0.5rem;
            overflow: hidden;
        }

        .strength-fill {
            height: 100%;
            border-radius: 2px;
            width: 0%;
            transition: width 0.3s, background 0.3s;
        }

        .strength-label {
            font-size: 0.7rem;
            margin-top: 0.3rem;
            color: rgba(255, 255, 255, 0.4);
        }

        .btn-row {
            display: flex;
            gap: 0.75rem;
        }

        .btn-back {
            flex: 1;
            padding: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.7);
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-next {
            flex: 2;
            padding: 1rem;
            border: none;
            border-radius: 12px;
            background: white;
            color: #4f46e5;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-next:hover {
            background: #f8fafc;
            transform: translateY(-1px);
        }

        .btn-next:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .success-screen {
            text-align: center;
            padding: 1.5rem 0;
        }

        .success-icon {
            width: 64px;
            height: 64px;
            background: rgba(34, 197, 94, 0.15);
            border: 2px solid rgba(34, 197, 94, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.25rem;
            color: #4ade80;
        }

        .alert-box {
            display: none;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            margin-bottom: 1.25rem;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #fca5a5;
        }
    </style>
    <link rel="stylesheet" href="theme.css">
</head>

<body>

    <div class="role-switch">
        <a href="user_login.html">
            <i data-lucide="arrow-left"></i>
            Back to Login
        </a>
    </div>

    <div class="login-container">
        <div class="login-header">
            <h1>Create Account</h1>
            <p>Join API Monitor — it's free</p>
        </div>

        <!-- Steps Bar -->
        <div class="steps-bar">
            <div class="step-dot active" id="dot-1">1</div>
            <div class="step-line" id="line-1"></div>
            <div class="step-dot" id="dot-2">2</div>
            <div class="step-line" id="line-2"></div>
            <div class="step-dot" id="dot-3">3</div>
        </div>

        <!-- Alert -->
        <div class="alert-box alert-error" id="alert-box"></div>

        <!-- Step 1: Email & Mobile -->
        <div class="step-panel active" id="step-1">
            <div class="form-group">
                <label for="email">Email Address <span style="color:#f87171">*</span></label>
                <div class="input-with-icon">
                    <i data-lucide="mail" class="input-icon" style="width:16px;height:16px;"></i>
                    <input type="email" id="email" class="form-input has-icon" placeholder="you@example.com"
                        autocomplete="email">
                </div>
            </div>
            <div class="form-group">
                <label for="mobile">Mobile Number <span
                        style="color:rgba(255,255,255,0.35);font-size:0.8rem;">(optional)</span></label>
                <div class="input-with-icon">
                    <i data-lucide="smartphone" class="input-icon" style="width:16px;height:16px;"></i>
                    <input type="tel" id="mobile" class="form-input has-icon" placeholder="+91 98765 43210"
                        autocomplete="tel">
                </div>
            </div>
            <button class="btn-next" style="width:100%;margin-top:0.5rem;" onclick="goToStep(2)">
                Continue &nbsp;→
            </button>
        </div>

        <!-- Step 2: Password -->
        <div class="step-panel" id="step-2">
            <div class="form-group">
                <label for="password">Password <span style="color:#f87171">*</span></label>
                <div class="input-with-icon">
                    <input type="password" id="password" class="form-input" placeholder="Min 8 characters"
                        autocomplete="new-password" oninput="checkStrength(this.value)" style="padding-right:3rem;">
                    <button type="button" class="password-toggle" onclick="togglePwd('password')"
                        style="top:50%;transform:translateY(-50%);">
                        <i data-lucide="eye"></i>
                    </button>
                </div>
                <div class="strength-bar">
                    <div class="strength-fill" id="strength-fill"></div>
                </div>
                <div class="strength-label" id="strength-label">Enter a password</div>
            </div>
            <div class="form-group">
                <label for="confirm">Confirm Password <span style="color:#f87171">*</span></label>
                <div class="input-with-icon">
                    <input type="password" id="confirm" class="form-input" placeholder="Re-enter password"
                        autocomplete="new-password" style="padding-right:3rem;">
                    <button type="button" class="password-toggle" onclick="togglePwd('confirm')"
                        style="top:50%;transform:translateY(-50%);">
                        <i data-lucide="eye"></i>
                    </button>
                </div>
            </div>
            <div class="btn-row">
                <button class="btn-back" onclick="goToStep(1)">← Back</button>
                <button class="btn-next" onclick="goToStep(3)">Continue &nbsp;→</button>
            </div>
        </div>

        <!-- Step 3: Review & Submit -->
        <div class="step-panel" id="step-3">
            <div
                style="background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:12px; padding:1.25rem; margin-bottom:1.5rem;">
                <div
                    style="font-size:0.8rem;color:rgba(255,255,255,0.4);margin-bottom:0.75rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;">
                    Account Summary</div>
                <div style="display:flex;flex-direction:column;gap:0.65rem;">
                    <div style="display:flex;justify-content:space-between;font-size:0.875rem;">
                        <span style="color:rgba(255,255,255,0.5);">Email</span>
                        <span id="review-email" style="color:white;font-weight:500;"></span>
                    </div>
                    <div style="display:flex;justify-content:space-between;font-size:0.875rem;">
                        <span style="color:rgba(255,255,255,0.5);">Mobile</span>
                        <span id="review-mobile" style="color:white;font-weight:500;"></span>
                    </div>
                    <div style="display:flex;justify-content:space-between;font-size:0.875rem;">
                        <span style="color:rgba(255,255,255,0.5);">Role</span>
                        <span style="color:#818cf8;font-weight:600;">User</span>
                    </div>
                </div>
            </div>
            <div class="btn-row">
                <button class="btn-back" onclick="goToStep(2)">← Back</button>
                <button class="btn-next" id="submit-btn" onclick="submitRegister()">Create Account</button>
            </div>
        </div>

        <!-- Step 4: Success -->
        <div class="step-panel" id="step-success">
            <div class="success-screen">
                <div class="success-icon">
                    <i data-lucide="check" style="width:28px;height:28px;"></i>
                </div>
                <h2 style="font-size:1.3rem;font-weight:700;margin-bottom:0.5rem;">Account Created!</h2>
                <p style="color:rgba(255,255,255,0.6);font-size:0.9rem;margin-bottom:2rem;">
                    Your API Monitor account is ready. Log in to get started.
                </p>
                <a href="user_login.html" class="btn-next"
                    style="display:block;text-align:center;text-decoration:none;padding:1rem;">
                    Go to Login
                </a>
            </div>
        </div>

        <div class="footer-links" id="footer-links">
            Already have an account? <a href="user_login.html">Sign in</a>
        </div>
    </div>

    <script>
        lucide.createIcons();
        const API_BASE = 'https://api-monitor-production-9679.up.railway.app/api/users';

        let currentStep = 1;

        // ── Step navigation ────────────────────────────────
        function goToStep(n) {
            if (n > currentStep && !validateStep(currentStep)) return;

            document.getElementById(`step-${currentStep}`).classList.remove('active');

            // Update dots/lines
            for (let i = 1; i <= 3; i++) {
                const dot = document.getElementById(`dot-${i}`);
                dot.classList.remove('active', 'done');
                if (i < n) dot.classList.add('done'), dot.innerHTML = '✓';
                else if (i === n) dot.classList.add('active'), dot.textContent = i;
                else dot.textContent = i;
            }
            for (let i = 1; i <= 2; i++) {
                document.getElementById(`line-${i}`).classList.toggle('done', i < n);
            }

            if (n === 3) populateReview();
            currentStep = n;
            document.getElementById(`step-${n}`).classList.add('active');
            clearAlert();
        }

        // ── Validation per step ────────────────────────────
        function validateStep(step) {
            clearAlert();
            if (step === 1) {
                const email = document.getElementById('email').value.trim();
                if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                    showAlert('Please enter a valid email address.'); return false;
                }
            }
            if (step === 2) {
                const pw = document.getElementById('password').value;
                const cpw = document.getElementById('confirm').value;
                if (pw.length < 8) { showAlert('Password must be at least 8 characters.'); return false; }
                if (pw !== cpw) { showAlert('Passwords do not match.'); return false; }
            }
            return true;
        }

        // ── Password strength ──────────────────────────────
        function checkStrength(pw) {
            const fill = document.getElementById('strength-fill');
            const label = document.getElementById('strength-label');
            let score = 0;
            if (pw.length >= 8) score++;
            if (/[A-Z]/.test(pw)) score++;
            if (/[0-9]/.test(pw)) score++;
            if (/[^A-Za-z0-9]/.test(pw)) score++;

            const levels = [
                { pct: '0%', color: '', text: 'Enter a password' },
                { pct: '25%', color: '#ef4444', text: 'Weak' },
                { pct: '50%', color: '#f59e0b', text: 'Fair' },
                { pct: '75%', color: '#3b82f6', text: 'Good' },
                { pct: '100%', color: '#22c55e', text: 'Strong 💪' },
            ];
            const lv = pw.length === 0 ? levels[0] : levels[Math.max(1, score)];
            fill.style.width = lv.pct;
            fill.style.background = lv.color;
            label.textContent = lv.text;
            label.style.color = lv.color || 'rgba(255,255,255,0.4)';
        }

        // ── Toggle password visibility ─────────────────────
        function togglePwd(inputId) {
            const input = document.getElementById(inputId);
            const btn = input.nextElementSibling;
            if (input.type === 'password') {
                input.type = 'text';
                btn.innerHTML = '<i data-lucide="eye-off"></i>';
            } else {
                input.type = 'password';
                btn.innerHTML = '<i data-lucide="eye"></i>';
            }
            lucide.createIcons();
        }

        // ── Review summary ─────────────────────────────────
        function populateReview() {
            document.getElementById('review-email').textContent = document.getElementById('email').value.trim();
            const mob = document.getElementById('mobile').value.trim();
            document.getElementById('review-mobile').textContent = mob || 'Not provided';
        }

        // ── Submit registration ────────────────────────────
        async function submitRegister() {
            const btn = document.getElementById('submit-btn');
            btn.textContent = 'Creating account...';
            btn.disabled = true;

            const payload = {
                email: document.getElementById('email').value.trim(),
                mobile_number: document.getElementById('mobile').value.trim() || '',
                password: document.getElementById('password').value,
                confirm_password: document.getElementById('confirm').value,
            };

            try {
                const res = await fetch(`${API_BASE}/register/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
                const data = await res.json();

                if (res.ok) {
                    // Show success panel
                    document.getElementById(`step-3`).classList.remove('active');
                    document.getElementById('step-success').classList.add('active');
                    document.getElementById('steps-bar') && (document.querySelector('.steps-bar').style.display = 'none');
                    document.querySelector('.steps-bar').style.display = 'none';
                    document.getElementById('footer-links').style.display = 'none';
                    lucide.createIcons();
                } else {
                    const msg = data.email?.[0] || data.mobile_number?.[0] ||
                        data.password?.[0] || data.detail || data.error ||
                        'Registration failed. Please try again.';
                    showAlert(msg);
                }
            } catch (err) {
                showAlert('Cannot connect to server. Make sure the API is running on port 8000.');
            } finally {
                btn.textContent = 'Create Account';
                btn.disabled = false;
            }
        }

        // ── Alert helpers ──────────────────────────────────
        function showAlert(msg) {
            const el = document.getElementById('alert-box');
            el.textContent = msg;
            el.style.display = 'block';
        }
        function clearAlert() {
            document.getElementById('alert-box').style.display = 'none';
        }
    </script>
</body>

</html>
